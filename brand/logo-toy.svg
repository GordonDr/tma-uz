<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="To'y-Daftar">
  <!--
    Знак To'y-Daftar — палак, восьмилепестковая розетка сюзане, тиснёная золотом.

    Два кольца были клише: их ставит каждый свадебный сервис мира, и о том, что
    продукт считает семьи для тойханы, они не говорят. Палак — центральный мотив
    вышивки, которая висит на каждом узбекском тое.

    Плоская заливка выглядела наклейкой, поэтому здесь настоящая отрисовка:
    у фона тканое зерно, у золота — градиент фольги с бликом на 35° и тиснение
    (светлая грань сверху, тень снизу), у всего знака — мягкая тень на ткани.
    Это те же приёмы, которыми печатают приглашения фольгой.
  -->
  <defs>
    <!-- Ткань: мелкая шероховатость плюс тёплая подсветка из левого верхнего угла -->
    <filter id="cloth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
      <feComponentTransfer in="ng" result="soft">
        <feFuncA type="linear" slope=".085" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>

    <radialGradient id="ground" cx="32%" cy="26%" r="88%">
      <stop offset="0" stop-color="#9A2A47"/>
      <stop offset="55%" stop-color="#781D38"/>
      <stop offset="100%" stop-color="#4A0C21"/>
    </radialGradient>

    <!-- Фольга: не один цвет, а чередование тёплого золота и почти белого блика.
         Именно смена светлого и тёмного вдоль градиента даёт металл. -->
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#8A6321"/>
      <stop offset="0.18" stop-color="#D9B45B"/>
      <stop offset="0.34" stop-color="#FBEFC9"/>
      <stop offset="0.46" stop-color="#E3C271"/>
      <stop offset="0.62" stop-color="#A87A2C"/>
      <stop offset="0.78" stop-color="#EBD290"/>
      <stop offset="1"    stop-color="#8A6321"/>
    </linearGradient>
    <linearGradient id="foilDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#6F4E19"/>
      <stop offset="0.3"  stop-color="#B08D3F"/>
      <stop offset="0.55" stop-color="#D4B872"/>
      <stop offset="1"    stop-color="#75531B"/>
    </linearGradient>

    <!-- Тиснение: копия формы, сдвинутая вниз, размытая и вычтенная — так
         получается фаска, а не обводка. -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="down"/>
      <feComposite in="down" in2="SourceAlpha" operator="out" result="shade"/>
      <feFlood flood-color="#3A0A18" flood-opacity=".55" result="dark"/>
      <feComposite in="dark" in2="shade" operator="in" result="lower"/>

      <feOffset in="b" dx="0" dy="-5" result="up"/>
      <feComposite in="up" in2="SourceAlpha" operator="out" result="lit"/>
      <feFlood flood-color="#FFF6DC" flood-opacity=".5" result="light"/>
      <feComposite in="light" in2="lit" operator="in" result="upper"/>

      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="lower"/>
        <feMergeNode in="upper"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#33071A" flood-opacity=".45"/>
    </filter>

    <!-- Лепесток вдоль −Y: две симметричные дуги, сходящиеся остриём. Узкий
         настолько, чтобы между соседними был виден фон — в вышивке лепестки
         разделены, а сомкнутые превращают розетку в звезду. -->
    <path id="pt" d="M0 -168 C 40 -96 40 -30 0 0 C -40 -30 -40 -96 0 -168 Z"/>
    <path id="ps" d="M0 -124 C 20 -70 20 -20 0 0 C -20 -20 -20 -70 0 -124 Z"/>
  </defs>

  <rect width="512" height="512" fill="url(#ground)" filter="url(#cloth)"/>

  <g transform="translate(256 256)" filter="url(#drop)">
    <g filter="url(#emboss)">
      <!-- Малые лепестки приглушены: держат плотность, но не спорят с восемью основными -->
      <g fill="url(#foilDim)">
        <use href="#ps" transform="rotate(22.5)"/>
        <use href="#ps" transform="rotate(67.5)"/>
        <use href="#ps" transform="rotate(112.5)"/>
        <use href="#ps" transform="rotate(157.5)"/>
        <use href="#ps" transform="rotate(202.5)"/>
        <use href="#ps" transform="rotate(247.5)"/>
        <use href="#ps" transform="rotate(292.5)"/>
        <use href="#ps" transform="rotate(337.5)"/>
      </g>
      <g fill="url(#foil)">
        <use href="#pt"/>
        <use href="#pt" transform="rotate(45)"/>
        <use href="#pt" transform="rotate(90)"/>
        <use href="#pt" transform="rotate(135)"/>
        <use href="#pt" transform="rotate(180)"/>
        <use href="#pt" transform="rotate(225)"/>
        <use href="#pt" transform="rotate(270)"/>
        <use href="#pt" transform="rotate(315)"/>
      </g>
      <circle r="38" fill="#5E1229"/>
      <circle r="19" fill="url(#foil)"/>
    </g>
    <!-- Палак всегда вписан в круг: кайма замыкает знак и не даёт ему
         рассыпаться на отдельные лепестки. -->
    <circle r="204" fill="none" stroke="url(#foil)" stroke-width="7" opacity=".7"/>
    <circle r="215" fill="none" stroke="url(#foil)" stroke-width="2.5" opacity=".4"/>
  </g>
</svg>
