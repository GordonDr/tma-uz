<!-- Набор шрифтов задан в themes.js: их десять на десять оформлений, и держать
     список в двух местах — верный способ получить подстановку системного. -->
<script src="themes.js"></script>
<script>document.write('<link rel="stylesheet" href="' + window.TOY_FONTS + '">');</script>
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2A211C; --muted:#7B6A5D; --accent:#B08D3F; --deep:#7D1F38;
  --accent-ink:#856521; --line:#E6DBCD; --shadow:0 10px 40px rgba(90,60,25,.07); --radius:20px;
  --display:"Cormorant Garamond",Georgia,serif; --body:Manrope,system-ui,sans-serif;
  --name-weight:500; --name-tracking:0; --name-size:1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
  transition:background .35s,color .35s}
.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}
section{padding:0 24px}

/* Приглашение открывают в чате между двумя другими сообщениями. Первый экран
   обязан быть приглашением, а не формой: имена во весь рост, дата под ними,
   и ничего больше. Ответ — ниже, отдельным действием. */
.cover{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;position:relative;padding:64px 30px 74px}
.cover-in{position:relative;z-index:2;width:100%}
.orn{display:block;margin:0 auto 18px;width:112px;height:26px;color:var(--accent)}
/* Мелкий текст берёт --accent-ink, а не --accent: золото и терракота красивы
   в орнаменте, но на 11 кегле по светлому фону не читаются. Орнаменты и линии
   остаются светлыми — к декору требований по контрасту нет. */
.pre{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent-ink);
  margin-bottom:22px;font-weight:600}
.names{font-family:var(--display);margin:0;
  font-size:calc(clamp(40px,13.5vw,72px) * var(--name-size));
  line-height:1.06;font-weight:var(--name-weight);letter-spacing:var(--name-tracking)}
.amp{color:var(--accent);font-style:italic;display:block;font-weight:400;
  font-size:.42em;margin:.16em 0;letter-spacing:0}
.cover-date{margin-top:26px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.cue{position:absolute;left:0;right:0;bottom:26px;z-index:2;color:var(--muted);
  font-size:19px;line-height:1;text-decoration:none;display:block;
  animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(5px);opacity:.9}}

/* Рамка обложки — то, чем одно оформление отличается от другого сильнее всего,
   поэтому она в атрибуте темы, а не зашита в разметку. */
.deco{position:absolute;inset:18px;z-index:1;pointer-events:none}
[data-frame="none"] .deco{display:none}
[data-frame="double"] .deco{border:1px solid var(--accent);opacity:.5}
[data-frame="double"] .deco::after{content:"";position:absolute;inset:6px;
  border:1px solid var(--accent);opacity:.55}
[data-frame="corner"] .deco::before,[data-frame="corner"] .deco::after{
  content:"";position:absolute;width:52px;height:52px;border:1px solid var(--accent);opacity:.6}
[data-frame="corner"] .deco::before{top:0;left:0;border-right:0;border-bottom:0}
[data-frame="corner"] .deco::after{bottom:0;right:0;border-left:0;border-top:0}
[data-frame="arch"] .deco{border:1px solid var(--accent);opacity:.45;
  border-radius:min(46vw,220px) min(46vw,220px) 3px 3px}
[data-frame="band"] .deco{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
[data-frame="band"] .deco::before,[data-frame="band"] .deco::after{
  content:"";position:absolute;left:0;right:0;height:14px;
  background-image:var(--band);background-repeat:repeat-x;opacity:.85}
[data-frame="band"] .deco::before{top:7px}
[data-frame="band"] .deco::after{bottom:7px}

/* Три раскладки имён: «Aziz & Nilufar» и «Bobojon 60 yosh» — разные объекты,
   и одна вёрстка на оба смотрится случайной. */
[data-names="caps"] .names{text-transform:uppercase}
[data-names="caps"] .amp{font-size:.34em;letter-spacing:.3em;text-transform:none}
[data-names="rule"] .amp{width:44px;height:1px;background:var(--accent);
  margin:.34em auto;font-size:0;color:transparent}

.address{padding-top:56px;padding-bottom:12px;text-align:center}
.address p{font-family:var(--display);font-size:clamp(19px,4.6vw,23px);line-height:1.62;
  margin:0 auto;max-width:34ch;color:var(--ink);text-wrap:pretty}

.details{padding-top:44px}
.details dl{margin:0;border-top:1px solid var(--line)}
.details .row{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;
  padding:15px 2px;border-bottom:1px solid var(--line)}
.details dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0}
.details dd{margin:0;font-size:16px;line-height:1.5}
.details dd .sub{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.map{display:inline-block;margin-top:18px;color:var(--deep);font-size:14.5px;
  text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;font-weight:600}
.cd{display:flex;justify-content:center;gap:22px;margin-top:30px}
.cd div{text-align:center;min-width:48px}
.cd b{display:block;font-family:var(--display);font-size:26px;color:var(--accent-ink);
  font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"lnum" 1}
.cd span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.rsvp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 22px;margin:44px 24px 0;box-shadow:var(--shadow);scroll-margin-top:20px}
.rsvp h2{font-family:var(--display);font-size:27px;margin:0 0 4px;text-align:center;font-weight:600}
.fam{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Главный ответ — один тап. «Придём все N» отвечает и отправляет сразу;
   остальные два варианта нужны реже и стоят второй строкой. */
.yesall{width:100%;background:var(--deep);color:var(--card);border-color:var(--deep);
  font-weight:700;font-size:16.5px;padding:17px;margin-bottom:10px}
.yesall:disabled{opacity:.6}
button{border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:calc(var(--radius) * .6);padding:14px;font:500 15px var(--body);
  cursor:pointer;transition:.15s}
button.yes.on{background:var(--deep);color:var(--card);border-color:var(--deep)}
button.no.on{background:var(--muted);color:var(--card);border-color:var(--muted)}
.count{margin-top:18px;display:none}
.count label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px;text-align:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:48px;height:48px;border-radius:50%;font-size:22px;padding:0;line-height:1}
.stepper b{font-family:var(--body);font-size:34px;min-width:46px;font-weight:600;
  font-variant-numeric:tabular-nums}
.err{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;
  background:rgba(180,40,60,.10);color:#B4283C;border:1px solid rgba(180,40,60,.30)}
textarea{width:100%;margin-top:16px;padding:12px;border:1px solid var(--line);
  border-radius:calc(var(--radius) * .6);background:transparent;color:var(--ink);
  font:400 14.5px var(--body);resize:vertical;min-height:58px}
textarea:focus{outline:none;border-color:var(--accent)}
.send{width:100%;margin-top:16px;background:var(--deep);color:var(--card);
  border-color:var(--deep);font-weight:700;font-size:16px;padding:16px}
.done{text-align:center;padding:24px 8px}
.done .big{font-family:var(--display);font-size:30px;margin-bottom:8px}
.wish{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
.wish b{display:block;font-family:var(--display);font-size:20px;font-weight:600;
  margin-bottom:8px;text-align:center}
.wish textarea{margin-top:0;min-height:76px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Виральная петля: один оплаченный той — сотни показов ссылки людям, у которых
   свой той через год. Открывается только после ответа: до него это была бы
   реклама поверх вопроса. */
.viral{margin:16px 24px 0;background:var(--card);border:1px dashed var(--line);
  border-radius:var(--radius);padding:20px;text-align:center}
.viral b{font-family:var(--display);font-size:20px;font-weight:600}
.viral p{margin:6px 0 14px;font-size:13.5px;color:var(--muted);line-height:1.55}
.vbtn{display:inline-block;text-decoration:none;border:1px solid var(--accent);
  color:var(--accent-ink);border-radius:12px;padding:11px 18px;font:600 14px var(--body)}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin:28px 24px 0;line-height:1.6}
.foot a{color:var(--muted)}

/* Переключатель языка — плавающий, доступен с любого места страницы.
   Гость мог получить приглашение на узбекском, а читать привычнее по-русски. */
.langbar{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:40;
  display:flex;gap:3px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.langbar button{border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 11.5px Manrope,system-ui,sans-serif;padding:5px 10px;border-radius:16px}
.langbar button.on{background:var(--accent-ink);color:var(--card)}
@media (max-width:400px){ .langbar button{padding:5px 8px;font-size:11px} }
</style>
</head>
<body>
<div class="langbar" id="langbar"></div>
<div class="wrap" id="wrap"><section class="cover"><div class="cover-in">…</div></section></div>

    markedYes:(n)=>`Мы отметили: ${n} чел.`, markedNo:"Будем рады видеть вас в другой раз",
    ics:"📅 Добавить в календарь",
    changeHint:"Если планы изменятся — откройте эту ссылку снова и поменяйте ответ.",
    fail:"Не получилось — попробуйте ещё раз",
    errPick:"Сначала выберите ответ: придём, придём не все или не сможем",
    today:"сегодня", dd:"дн.", hh:"ч.", mm:"мин.",
    madeIn:"Создано в To'y-Daftar", makeOwn:"сделать приглашение для своего тоя",
    previewTheme:(l)=>`Предпросмотр темы «${l}»`,
    icsTitle:"Той", icsAlarm:"Завтра той",
    icsDesc:"Приглашение: чтобы изменить ответ, откройте ссылку из сообщения",
  },
};
const LANG_ORDER = ["uz_latin","uz_cyrillic","ru"];
const LANG_BTN = { uz_latin:"O'z", uz_cyrillic:"Ўз", ru:"Ру" };
// Параметры адреса объявлены здесь, а не ниже: LK на них ссылается, и обращение
// к const до инициализации роняло весь скрипт — гость видел пустую карточку.
// Данные могут прийти двумя путями: вложенными в страницу сервером (шаг 55, ссылка
// вида /inv/<token> — она же даёт превью в чате) или фетчем по ?t=<token> со старой
// статической страницы. Второй путь оставлен ради ссылок, разосланных раньше.
const PRE = (window.__INVITE && window.__INVITE.token) ? window.__INVITE : null;
const token = PRE ? PRE.token : (new URLSearchParams(location.search).get("t") || "");
const previewTheme = new URLSearchParams(location.search).get("theme");
const previewLang = new URLSearchParams(location.search).get("ilang");
const LK = "td_ilang_" + (token || "preview");
let lang = (()=>{ try{ const v=localStorage.getItem(LK); if(UI[v]) return v; }catch(e){} return null; })();
const U = () => UI[lang] || UI.uz_latin;

function renderLangBar(){
  const bar=document.getElementById("langbar");
  bar.innerHTML = LANG_ORDER.map(l=>`<button data-l="${l}" class="${l===lang?"on":""}">${LANG_BTN[l]}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.l; try{ localStorage.setItem(LK,lang); }catch(e){}
    renderLangBar(); if(LAST) render(LAST.e, LAST.f, LAST.preview);
  });
}
let LAST = null;   // последние данные, чтобы перерисовать при смене языка

/* ---------- темы оформления ---------- */
/* Оформления живут в themes.js — общем для приглашения, кабинета и демо. */
const applyTheme = (name) => toyApplyTheme(name);
// Кавычки экранируем тоже: значения подставляются и в атрибуты (href карты),
// а без этого организатор может внедрить атрибут на страницу, которую видят его гости.
const esc = s => String(s??"").replace(/[<>&"']/g,c=>
  ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
// Русские числительные: «4 человека», но «5 человек». Строка стоит на самой заметной
// кнопке приглашения — кривое согласование там читается как небрежность.
const plu=(n,one,few,many)=>{
  const m10=n%10, m100=n%100;
  if(m10===1 && m100!==11) return one;
  if(m10>=2 && m10<=4 && (m100<12 || m100>14)) return few;
  return many;
};
// Дату собираем сами: браузерная локаль uz-UZ выдаёт «2026 M11 7» — на приглашении
// это выглядит как ошибка. Русскую отдаём Intl, там всё в порядке.
const MONTHS = {
  uz_latin:  ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"],
  uz_cyrillic:["январ","феврал","март","апрел","май","июн","июл","август","сентябр","октябр","ноябр","декабр"],
};
function fmtDate(d, u){
  const opt = { timeZone:"Asia/Tashkent" };
  const day = Number(new Intl.DateTimeFormat("en-GB", { ...opt, day:"numeric" }).format(d));
  const mon = Number(new Intl.DateTimeFormat("en-GB", { ...opt, month:"numeric" }).format(d)) - 1;
  const yr  = new Intl.DateTimeFormat("en-GB", { ...opt, year:"numeric" }).format(d);
  const list = MONTHS[u.code === "ru" ? "ru" : (u.short === "ЎЗ" ? "uz_cyrillic" : "uz_latin")];
  if (!list) return d.toLocaleDateString(u.locale, { day:"numeric", month:"long", year:"numeric", ...opt });
  return `${day} ${list[mon]} ${yr}`;
}
let state = { status:null, count:0, inv:2 };


// Запускается в самом конце файла: в режиме предпросмотра render() вызывается синхронно,
// и при вызове отсюда он читал TASHKENT_OFFSET, объявленный ниже, — приглашение падало.
async function boot(){
  if(PRE){
    applyTheme(PRE.event && PRE.event.theme);
    return render(PRE.event, PRE.family);
  }
  if(!token){

    if(previewTheme){ // режим предпросмотра темы и языка из кабинета
      applyTheme(previewTheme);
      const il = UI[previewLang] ? previewLang : "uz_latin";
      if(!lang) lang = il;
      // Поля из кабинета: человек смотрит на своё приглашение, а не на образец
      // с чужими именами. Чего он ещё не ввёл — подставляем демонстрационное.
      const q = new URLSearchParams(location.search);
      const pick = (k, dflt) => (q.get(k) || "").trim().slice(0, 120) || dflt;
      const greet = pick("greet",
        (window.toyOccasion ? toyOccasion("nikoh_toy").greeting[il] : "") || UI[il].greetDefault);
      return render({
        couple: pick("couple", "Aziz & Nilufar"),
        event_date: pick("date", "2026-10-18"),
        event_time: pick("time", "18:00"),
        venue_name: pick("venue", "To'yxona «Zarafshon»"),
        venue_addr: pick("addr", "Toshkent, Chilonzor"),
        map_url: "", greeting: greet, theme: previewTheme, lang: il },
        {name:"Karimovlar oilasi",invited_count:4,rsvp_status:"pending",rsvp_count:0}, true);
    }
    return fail("—");
  }
  const r = await fetch(`${API}/i/${token}`).then(x=>x.json()).catch(()=>null);
  if(!r || r.error) return fail("Приглашение не найдено");
  applyTheme(r.event?.theme);
  render(r.event, r.family);
}
function fail(msg){
 document.getElementById("wrap").innerHTML = `<div class="frame"><div class="greet">${msg}</div></div>`; }

// Время тоя — по Ташкенту (UTC+5), а не по часам телефона гостя: половина родни смотрит
// приглашение из РФ и Кореи, и без явной зоны отсчёт врал бы на часы.
// Плюс организатор может ввести «6» или «18:0» — padStart тут давал "00006" и Invalid Date.
const TASHKENT_OFFSET = "+05:00";
function normTime(v){
  const s = String(v || "").trim();
  const m = s.match(/^(\d{1,2})\D*(\d{1,2})?/);
  if(!m) return "18:00";
  const h = Math.min(23, parseInt(m[1],10) || 0);
  const mi = Math.min(59, parseInt(m[2] || "0",10) || 0);
  return String(h).padStart(2,"0") + ":" + String(mi).padStart(2,"0");
}
function eventDate(e){
  if(!e.event_date) return null;
  const d = new Date(`${e.event_date}T${normTime(e.event_time)}:00${TASHKENT_OFFSET}`);
  return isNaN(d.getTime()) ? null : d;
}
function render(e, f, preview){
  LAST = {e, f, preview};
  // Язык по умолчанию — тот, что выбрал организатор для этого тоя. Гостевой выбор его перебивает.
  if(!lang) lang = UI[e.lang] ? e.lang : "uz_latin";
  renderLangBar();
  const u = U();
  document.documentElement.lang = u.code;
  const t = toyApplyTheme(e.theme);
  state.inv=f.invited_count; state.count=f.rsvp_count||f.invited_count;
  const d = eventDate(e);
  const dateStr = d ? fmtDate(d, u) : "";
  const names=(e.couple||"").split(/&|\bи\b/);
  const row = (label, value) => value
    ? `<div class="row"><dt>${label}</dt><dd>${value}</dd></div>` : "";
  document.getElementById("wrap").innerHTML = `
  <section class="cover">
    <div class="deco" aria-hidden="true"></div>
    <div class="cover-in">
      ${t.orn}
      <div class="pre">${u.pre}</div>
      <h1 class="names">${esc(names[0].trim())}${names[1]?`<span class="amp">&amp;</span>${esc(names[1].trim())}`:""}</h1>
      ${dateStr?`<div class="cover-date">${dateStr}</div>`:""}
    </div>
    <a class="cue" href="#rsvp" aria-label="${esc(u.ask)}">&darr;</a>
  </section>

  <section class="address"><p>${esc(e.greeting||u.greetDefault)}</p></section>

  <section class="details">
    <dl>
      ${row(u.lblWhen, dateStr ? `${dateStr}${e.event_time?`<span class="sub">${esc(normTime(e.event_time))}</span>`:""}` : "")}
      ${row(u.lblWhere, e.venue_name ? `${esc(e.venue_name)}${e.venue_addr?`<span class="sub">${esc(e.venue_addr)}</span>`:""}` : "")}
    </dl>
    ${e.map_url?`<a class="map" href="${esc(e.map_url)}" target="_blank" rel="noopener">${u.map}</a>`:""}
    <div class="cd" id="cd"></div>
  </section>
  <section class="rsvp" id="rsvp">
    <h2>${u.ask}</h2>
    <div class="fam">${esc(f.name)} · ${u.invited(f.invited_count)}</div>
    <button class="yesall" id="bAll">${u.yesAll(f.invited_count)}</button>
    <div class="choice"><button class="yes" id="bYes">${u.yesSome}</button><button class="no" id="bNo">${u.no}</button></div>

    <div class="count" id="cnt">
      <label>${u.howMany}</label>
      <div class="stepper"><button id="m">−</button><b id="n">${state.count}</b><button id="p">+</button></div>
    </div>
    <div class="err" id="err" role="alert" hidden></div>
    <button class="send" id="send">${preview?u.previewBtn:u.send}</button>
  </section>
  ${preview?"":`<div class="viral" id="viral"${f.rsvp_status==="pending"?" hidden":""}>
    <b>${u.viralTitle}</b>
    <p>${u.viralText(VIRAL_OFF.toLocaleString("ru"))}</p>
    <a class="vbtn" href="https://t.me/${BOT}?start=inv${e.id?`_${e.id}`:""}">${u.viralBtn}</a>
  </div>`}
  <div class="foot">${preview?u.previewTheme(t.label[lang]||t.label.ru):`${u.madeIn} · <a href="https://t.me/${BOT}?start=inv${e.id?`_${e.id}`:""}">${u.makeOwn}</a>`}

    <div style="margin-top:14px;font-size:11px;opacity:.85;text-align:left">
      <b>${u.privTitle}.</b> ${u.privText}
      <a href="oferta.html" target="_blank" rel="noopener">${u.privLink}</a></div></div>`;
  if(d) tick(d);
  const bAll=document.getElementById("bAll");
  const bY=document.getElementById("bYes"), bN=document.getElementById("bNo"), cnt=document.getElementById("cnt");
  const sendBtn=document.getElementById("send");

  // Отправка одна на все три кнопки: «придём все» и «не сможем» отвечают в один тап,
  // «придём не все» сначала открывает счётчик и поле для комментария.
  // Отметка «открыл» уходит не при загрузке, а когда страница действительно
  // перед глазами: превьюшник ссылок и предпросмотр из кабинета сюда не попадают.
  function markSeen(){
    if(preview || !token || markSeen.done) return;
    if(document.visibilityState !== "visible") return;
    markSeen.done = true;
    fetch(`${API}/seen`,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({token})}).catch(()=>{});
  }
  setTimeout(markSeen, 3000);
  document.addEventListener("visibilitychange", ()=>setTimeout(markSeen, 3000), {once:true});

  function showErr(msg){
    const box=document.getElementById("err"); if(!box) return;
    box.textContent = msg || ""; box.hidden = !msg;
    if(msg) box.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  async function submit(btn){
    if(preview) return;
    // Ошибку показываем в самой карточке: alert в браузере Telegram гость
    // закрывает не читая, а причина — «не выбран ответ» — остаётся за кадром.
    if(!state.status) return showErr(u.errPick);
    showErr(null);
    const label=btn.textContent;
    btn.disabled=true; btn.textContent=u.sending;
    const noteEl=null;   // пожелание собираем после ответа, отдельной ручкой /wish
    const res = await fetch(`${API}/rsvp`,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({token,status:state.status,count:state.count,note:noteEl?noteEl.value:""})}).then(x=>x.json()).catch(()=>null);
    if(!res?.ok){ btn.disabled=false; btn.textContent=label; return showErr(u.fail); }
    document.getElementById("rsvp").innerHTML =
      // Пожелание просим ПОСЛЕ ответа, а не до. Раньше поле стояло рядом с
      // «Сможете прийти?» и отвлекало от главного действия; теперь оно приходит
      // в единственную секунду, когда человек уже сказал «придём» и расположен.
      `<div class="done"><div class="big">${state.status==="yes"?u.doneYes:u.doneNo}</div>
      <div class="fam">${state.status==="yes"?u.markedYes(state.count):u.markedNo}</div>
      ${state.status==="yes"&&d?`<button class="send" id="ics" style="margin-top:14px">${u.ics}</button>`:""}
      <div class="wish" id="wishBox">
        <b>${u.wishTitle}</b>
        <textarea id="wish" placeholder="${u.wishPh}" maxlength="600"></textarea>
        <button class="send" id="wishGo">${u.wishBtn}</button>
      </div>
      <div class="fam" style="margin-top:12px">${u.changeHint}</div></div>`;
    const wb = document.getElementById("wishGo");
    if(wb) wb.onclick = async () => {
      const text = document.getElementById("wish").value.trim();
      if(!text) return;
      wb.disabled = true; wb.textContent = u.sending;
      const ok = await fetch(`${API}/wish`, { method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({ token, text }) }).then(x=>x.json()).catch(()=>null);
      document.getElementById("wishBox").innerHTML =
        `<div class="fam">${ok?.ok ? u.wishDone : u.fail}</div>`;
    };
    const ics=document.getElementById("ics"); if(ics) ics.onclick=()=>addToCalendar(e,d);
    // Оффер показываем только после ответа. До ответа он стоял вплотную к
    // «Сможете прийти?» и первым, что видел гость, была реклама — а расположен
    // он ровно в ту секунду, когда только что написал «придём».
    const vr=document.getElementById("viral");
    if(vr){ vr.hidden=false; setTimeout(()=>vr.scrollIntoView({block:"nearest",behavior:"smooth"}), 400); }
  }

  bAll.onclick=()=>{ state.status="yes"; state.count=state.inv; submit(bAll); };
  bY.onclick=()=>{state.status="yes";bY.classList.add("on");bN.classList.remove("on");cnt.style.display="block";};
  bN.onclick=()=>{ state.status="no";bN.classList.add("on");bY.classList.remove("on");cnt.style.display="none"; submit(bN); };
  document.getElementById("m").onclick=()=>{state.count=Math.max(1,state.count-1);document.getElementById("n").textContent=state.count;};
  document.getElementById("p").onclick=()=>{state.count=Math.min(state.inv+4,state.count+1);document.getElementById("n").textContent=state.count;};
  // Уже отвечавшему открываем счётчик: он вернулся по ссылке, чтобы поправить число.
  if(f.rsvp_status==="yes"){ state.status="yes"; bY.classList.add("on"); cnt.style.display="block"; }
  sendBtn.onclick=()=>submit(sendBtn);
}

function addToCalendar(e,d){
  const pad=n=>String(n).padStart(2,"0");
  const fmt=x=>`${x.getUTCFullYear()}${pad(x.getUTCMonth()+1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}00Z`;
  const end=new Date(d.getTime()+5*3600*1000);
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//toy-daftar//UZ//RU","BEGIN:VEVENT",
    `UID:${Date.now()}@toy-daftar`,`DTSTAMP:${fmt(new Date())}`,`DTSTART:${fmt(d)}`,`DTEND:${fmt(end)}`,
    `SUMMARY:${U().icsTitle} — ${(e.couple||"").replace(/[,;]/g," ")}`,
    `LOCATION:${[(e.venue_name||""),(e.venue_addr||"")].filter(Boolean).join(" ").replace(/[,;]/g," ")}`,
    "DESCRIPTION:"+U().icsDesc,
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+U().icsAlarm,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="toy.ics"; a.click(); URL.revokeObjectURL(a.href);
}
function tick(d){
  const el=document.getElementById("cd");
  const upd=()=>{ const ms=d-new Date(); if(ms<=0){el.innerHTML=`<div><b>🎉</b><span>${U().today}</span></div>`;return;}
    const dd=Math.floor(ms/864e5), hh=Math.floor(ms/36e5)%24, mm=Math.floor(ms/6e4)%60;
    el.innerHTML=`<div><b>${dd}</b><span>${U().dd}</span></div><div><b>${hh}</b><span>${U().hh}</span></div><div><b>${mm}</b><span>${U().mm}</span></div>`; };
  upd(); setInterval(upd,60000);
}

boot();
</script>

</body>
