  const t=L(), e=S.ev;
  const cur = e.theme || "zar";
  const occ = (window.TOY_OCCASIONS||[]), P = presets();
  const ilang = lang === "uz" ? "uz_latin" : "ru";
  const paid = e.tier === "premium" || e.tier === "full";
  $("#tab").innerHTML=`
  <div class="card"><b>${t.eThemeTitle}</b>
    <div class="note">${t.eThemeNote}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px" id="themes">
      ${toyThemeList().map(x=>{
        const locked = x.tier === "premium" && !paid;
        return `<div class="t" data-th="${x.id}" data-locked="${locked?1:0}"
          style="text-align:left;padding:12px;position:relative;${cur===x.id?"border-color:var(--deep);background:var(--deep-bg)":""}${locked?";opacity:.72":""}">
        <div style="display:flex;gap:4px;margin-bottom:8px">${x.c.map(c=>`<span style="width:18px;height:18px;border-radius:50%;background:${c};border:1px solid var(--line);display:inline-block"></span>`).join("")}</div>
        <div style="font-weight:700;font-size:14px">${esc(x.label[ilang])}${locked?' <span title="Premium">🔒</span>':""}</div>
        <div style="font-size:11.5px;color:var(--muted)">${esc(x.sub[ilang])}</div></div>`;}).join("")}
    </div>
    ${paid?"":`<div class="note">${t.eThemeLocked}</div>`}
    <button class="b sec" id="preview">${t.ePreviewBtn}</button>
    ${paid ? `<button class="b sec" id="printInv">${t.pInvBtn}</button>
              <div class="note">${t.pInvNote}</div>`
           : `<div class="note" style="margin-top:10px">${t.pInvLocked}</div>`}
    <div id="themeLock" hidden style="margin-top:10px">
      <div class="note" style="margin-bottom:8px">${t.eThemeBuy}</div>
      <button class="b gold" id="buyTheme">${t.payPremium}</button></div></div>

  <div class="card"><b>${t.eDataTitle}</b>
    <label>${t.eNames}</label><input id="couple" value="${esc(e.couple)}">
    <div class="row2">
      <div><label>${t.eOccasionLabel}</label><select id="occ">${occ.map(o=>`<option value="${o.id}"${o.id===(e.occasion||"nikoh_toy")?" selected":""}>${o.label[lang==="uz"?"uz_latin":"ru"]}</option>`).join("")}</select></div>
      <div><label>${t.eLangLabel}</label><select id="ilang">${INV_LANGS.map(l=>`<option value="${l.id}"${l.id===(e.lang||"uz_latin")?" selected":""}>${l.label}</option>`).join("")}</select></div>
    </div>
    <div class="row2"><div><label>${t.date}</label><input id="date" type="date" value="${e.event_date||""}"></div>
      <div><label>${t.time}</label><input id="time" value="${esc(e.event_time||"")}"></div></div>
    <label>${t.venue}</label><input id="venue" value="${esc(e.venue_name||"")}">
    <label>${t.addr}</label><input id="addr" value="${esc(e.venue_addr||"")}">
    <label>${t.eMap}</label><input id="map" value="${esc(e.map_url||"")}">
    <label>${t.ePresetLabel}</label>
    <select id="preset"><option value="">${t.ePresetNone}</option>${P.map(p=>`<option value="${p.id}">${p.label}</option>`).join("")}</select>
    <label>${t.newGreet}</label><textarea id="greet">${esc(e.greeting||"")}</textarea>
    <button class="b" id="save">${t.eSave}</button></div>
  ${e.tier!=="full"?`<div class="lock"><b>${t.eTierTitle(e.tier==="free"?t.tierFree:t.tierPremium)}</b>
    <p>${e.tier==="free"?t.eTierFreeText:t.eTierPremiumText}</p>
    ${e.tier==="free"?`<button class="b gold" id="buyP">${t.payPremium}</button>`:""}
    <button class="b gold" id="buyF" style="${e.tier==="free"?"background:transparent;color:var(--gold);border:1px solid var(--gold)":""}">${t.payFull}</button></div>`:""}
  <div class="card"><b>${t.coTitle}</b>
    <div class="note" style="margin-top:4px">${t.coText}</div>
    <div id="coList" style="margin-top:10px"></div>
    ${e.is_co ? `<div class="note">${t.coYouAre}</div>`
      : paid ? `<button class="b sec" id="coInvite" style="margin-top:10px">${t.coInviteBtn}</button>`
             : `<button class="b gold" id="coBuy" style="margin-top:10px">${t.coBuyBtn}</button>`}
  </div>
  ${e.is_co ? "" : `<div class="card"><button class="b sec" id="delev" style="color:var(--bad);border-color:var(--bad)">${t.eDeleteBtn}</button>
    <div class="note">${t.eDeleteNote}</div></div>`}`;
  let pickedTheme = cur;
  document.querySelectorAll("#themes .t").forEach(el=>el.onclick=()=>{
    // Закрытое оформление можно выбрать и посмотреть, но нельзя сохранить: человек
    // должен увидеть, за что платит, а не упереться в замок вслепую.
    pickedTheme = el.dataset.th; haptic("light");
    document.querySelectorAll("#themes .t").forEach(x=>{x.style.borderColor="";x.style.background="";});
    el.style.borderColor="var(--deep)"; el.style.background="var(--deep-bg)";
    $("#themeLock").hidden = el.dataset.locked !== "1";
  });
  $("#buyTheme") && ($("#buyTheme").onclick=()=>pay("premium"));
  $("#coBuy") && ($("#coBuy").onclick=()=>pay("premium"));
  // На вкладке «Той» — образец: показать, как выйдет, до того как печатать кому-то.
  $("#printInv") && ($("#printInv").onclick=()=>{ haptic("medium"); invitePng(S.fams[0]); });
  coRefresh();
  $("#coInvite") && ($("#coInvite").onclick=async()=>{
    const r = await call("co_invite", { event_id: e.id });
    if(!r.token) return say(t.coErr);
    const link = `https://t.me/${(window.TOY_BOT||"toy_daftar_bot")}?start=co_${r.token}`;
    haptic("medium");
    // Ссылка одноразовая, поэтому уходит адресно через выбор чата, а не в буфер:
    // из буфера её вставляют в общий чат родни, и войдёт кто угодно первым.
    const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(t.coShare(e.couple))}`;
    tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url);
  });
  $("#preview").onclick=()=>{
    const url = `${S.inviteBase}?theme=${pickedTheme}&ilang=${$("#ilang").value}`;
    tg?.openLink ? tg.openLink(url) : window.open(url,"_blank");
  };
  // Смена повода или языка подставляет соответствующий текст — 18 вариантов вместо ручного набора.
  const applyPreset=()=>{
    const o=(window.toyOccasion? toyOccasion($("#occ").value) : null);
    if(o) $("#greet").value = o.greeting[$("#ilang").value] || $("#greet").value;
  };
  $("#occ").onchange=applyPreset; $("#ilang").onchange=applyPreset;
  $("#preset").onchange=e2=>{ const p=P.find(x=>x.id===e2.target.value); if(p) $("#greet").value=p.text; };
  $("#save").onclick=async()=>{ haptic("medium");
    const r=await call("event_save",{event:{id:e.id,couple:$("#couple").value,event_date:$("#date").value,
      event_time:$("#time").value,venue_name:$("#venue").value,venue_addr:$("#addr").value,map_url:$("#map").value,
      greeting:$("#greet").value,theme:pickedTheme,occasion:$("#occ").value,lang:$("#ilang").value}});
    if(!r.event) return;
    S.ev=r.event;
    // Остальное сохранилось — не молчим и не говорим «сохранено», когда оформление
    // откатилось: человек уехал бы с уверенностью, что выбрал платную тему.
    say(r.theme_denied ? t.eSavedNoTheme : t.eSaved);
    render(); };
  // Удаление идёт через бота: там подтверждение в два шага и понятно, что отменить нельзя.
  $("#delev").onclick=()=>{
    const url=`https://t.me/${(window.TOY_BOT||"toy_daftar_bot")}?start=cmd_delete`;
    tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url);
  };
  $("#buyP") && ($("#buyP").onclick=()=>pay("premium"));
  $("#buyF") && ($("#buyF").onclick=()=>pay("full"));
}
// Мини-апп закрываем ТОЛЬКО если счёт действительно ушёл: иначе человек нажал
// «Premium — 49 000», приложение схлопнулось, а в чате пусто.
async function pay(tier){
  haptic("medium");
  let r=null;
  try { r = await call("pay",{event_id:S.ev.id,tier}); } catch(e){}
  if(r?.ok) tg?.close?.();
  else tg?.showAlert?.(L().errAccess);
}
renderLangSeg(); applyTheme();
document.getElementById("themebtn").onclick=cycleTheme;
document.documentElement.lang = lang==="uz" ? "uz" : "ru";
boot();
</script>
</body>
</html>
