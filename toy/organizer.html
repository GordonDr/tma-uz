<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- Превью ссылки. Кабинет открывают из Telegram, но его адрес пересылают
     руками чаще, чем кажется: организатор кидает ссылку второй стороне тоя.
     До 28.08 в превью уходил знак продукта на пустом поле — ни имени,
     ни строки о том, что это. Картинка рисуется tools/og-draw.html. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Toʻy-Daftar">
<meta property="og:locale" content="ru_RU">
<meta property="og:locale:alternate" content="uz_UZ">
<meta property="og:title" content="Toʻy-Daftar — кабинет тоя">
<meta property="og:description" content="Семьи, ответы, точное число для тойханы, рассадка по столам и книга подарков — в одном месте.">
<meta property="og:url" content="https://gordondr.github.io/tma-uz/toy/organizer.html">
<meta property="og:image" content="https://gordondr.github.io/tma-uz/toy/og/og-ru.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="Toʻy-Daftar. Тойхона берёт за приглашённых, а не за пришедших: 4 750 000 сум за 19 мест, которые держат за восемью молчащими семьями.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../brand/logo-toy.svg" type="image/svg+xml">
<link rel="icon" href="../brand/toy-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../brand/toy-apple.png">
<title>Toʻy-Daftar — кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Шрифты свои, рядом с продуктом: fonts/fonts.css. Печатное приглашение
     рисуется шрифтом выбранного оформления, а их десять, поэтому набор один
     на все страницы — иначе canvas подставит системный.
     Раньше здесь стоял document.write со ссылкой на fonts.googleapis.com. -->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="themes.js"></script>
<!-- Счёт для зала, рассадка и список для печати живут в zal.js, а не здесь:
     их же рисует образец (obrazec.html) на выдуманном тое, до всяких денег.
     Держать две копии значило бы иметь два разных счёта — один за замком,
     другой на витрине, — и они разъехались бы с первой правки. -->
<script src="zal.js"></script>
<script src="config.js"></script>
<script src="i18n-organizer.js"></script>
<script src="invite-texts.js"></script>
<script src="qr.js"></script>
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2A211C; --ink2:#5C4C42; --muted:#8B7A6C;
  --line:#EADFD2; --line2:#F5EEE5; --gold:#B08D3F; --gold-bg:#FBF3E2; --deep:#7D1F38; --deep-bg:#FAEDF0;
  --ok:#2E7D4F; --ok-bg:#E8F3EC; --warn:#A86B00; --warn-bg:#FDF2DC; --bad:#B3403A; --bad-bg:#FAE9E8;
  --shadow:0 1px 2px rgba(90,60,30,.05), 0 10px 28px rgba(90,60,30,.07);
}
:root[data-theme="dark"]{
  --bg:#17130F; --card:#211A15; --ink:#F0E7DC; --ink2:#C7B6A5; --muted:#9C8875;
  --line:#33291F; --line2:#282018; --gold:#D5B366; --gold-bg:#2A2213; --deep:#D98AA0; --deep-bg:#2E1B20;
  --ok:#6CC493; --ok-bg:#17301F; --warn:#E6B254; --warn-bg:#33270E; --bad:#E6847E; --bad-bg:#3A1F1D;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Roboto,sans-serif;
  font-size:15.5px;line-height:1.5;padding:0 0 30px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600;line-height:1.15}
.serif{font-family:"Cormorant Garamond",Georgia,serif}

/* header */
.top{text-align:center;padding:20px 0 12px}
.top .orn{display:block;margin:0 auto 10px;width:96px;height:22px}
.top h1{font-size:clamp(28px,8vw,38px)}
.top .amp{color:var(--gold);font-style:italic;display:block;font-size:.55em;margin:0}
.top .pre{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin-bottom:5px}
.top .meta{color:var(--muted);font-size:13px;margin-top:6px}
.top .tier{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 5px;text-align:center;box-shadow:var(--shadow)}
.stats b{display:block;font-family:"Cormorant Garamond",serif;font-size:27px;line-height:1;font-weight:600}
/* Лист согласия на первом запуске. Не модалка поверх контента, а лист снизу:
   его читают, а не отмахиваются от него. */
.sheet-ov{position:fixed;inset:0;z-index:90;background:rgba(42,33,28,.55);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2);
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sheet ul{margin:0 0 14px;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink2)}
.sheet li{margin-bottom:6px}
.sheet li b{color:var(--ink)}
.sheet .ok{width:100%;border:0;border-radius:14px;padding:15px;background:var(--deep);
  color:#fff;font:600 15.5px Manrope,system-ui,sans-serif;cursor:pointer}
.sheet .more{display:block;text-align:center;margin-top:11px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 18px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:26px;line-height:1;cursor:pointer}
.stepper button:active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.stepper div{min-width:64px;text-align:center;font-size:34px;font-weight:600;
  font-variant-numeric:tabular-nums}
.pngov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:center;
  justify-content:center;padding:16px;overflow:auto}
.pngov .inner{max-width:420px;width:100%}
.pngov img{width:100%;border-radius:12px;display:block;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pngov .hint{color:#fff;font-size:13.5px;line-height:1.5;text-align:center;margin:12px 0 10px;opacity:.9}

/* A-22: документ по столам на телефоне показываем свёрстанным во весь экран.
   Раньше он уходил в dl() и на телефоне оборачивался простынёй HTML-исходника. */
.docov{position:fixed;inset:0;z-index:85;background:rgba(42,33,28,.78);
  display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto}
.docov .dwrap{width:100%;max-width:620px}
.docov .dpaper{background:#fff;color:#1C1613;border-radius:14px;padding:18px 16px;
  font:400 14px Manrope,system-ui,sans-serif;line-height:1.5;overflow-x:auto}
.docov .dpaper h1{font:600 19px "Cormorant Garamond",Georgia,serif;text-align:center;margin:0 0 10px}
.docov .dpaper h3{font:600 15px Manrope,sans-serif;margin:16px 0 6px}
.docov .dpaper p{margin:0 0 8px}
.docov .dpaper table{border-collapse:collapse;width:100%;font-size:13px}
.docov .dpaper td,.docov .dpaper th{border:1px solid #C9BCA9;padding:6px 8px;text-align:left}
.docov .dpaper th{background:#F4EDE3;font-weight:600}
.docov .dbar{display:flex;gap:8px;margin-top:12px}
.docov .dbar .b{margin:0;flex:1}
.docov .dhint{color:#fff;opacity:.9;font-size:12.5px;line-height:1.5;text-align:center;margin-top:10px}

.stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  font:600 13px Manrope,sans-serif;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--deep);color:#fff;border-color:var(--deep)}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:9px 0;box-shadow:var(--shadow)}
.card > b{font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;display:block;margin-bottom:8px}
label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px;font-weight:600;letter-spacing:.02em}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);font:500 15px Manrope,sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line2);font-size:14.5px}
.mrow span{color:var(--ink2)}
.mrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow.warn b,.mrow.warn span{color:var(--warn)}
.mrow.total{border-bottom:0;border-top:1px solid var(--line);margin-top:2px;padding-top:12px;
  font-size:16px;font-weight:600}
.mrow.total b{font-family:var(--display,inherit);font-size:20px}
.ic{background:none;border:0;font-size:17px;line-height:1;cursor:pointer;padding:6px;border-radius:8px}
.ic:active{background:var(--line2)}
button.b{width:100%;border:0;border-radius:12px;padding:13px;background:var(--deep);color:#fff;
  font:700 15px Manrope,sans-serif;cursor:pointer;margin-top:10px}
button.b:active{transform:translateY(1px)}
button.b.gold{background:var(--gold);color:#231a08}
button.b.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* guest rows */
.fam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:7px 0;box-shadow:var(--shadow)}
.fam .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fam .nm{font-weight:600;font-size:15px}
.fam .sb{font-size:12px;color:var(--muted);margin-top:2px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.pill.yes{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink2);
  font:600 12.5px Manrope,sans-serif;padding:8px;border-radius:10px;cursor:pointer}
.acts button.pri{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.wish{margin-top:8px;font-size:13px;color:var(--ink2);font-style:italic;border-left:2px solid var(--gold);padding-left:9px}

/* paywall / notice */
.lock{background:var(--gold-bg);border:1px solid var(--gold);border-radius:16px;padding:15px;margin:9px 0}
.lock b{font-family:"Cormorant Garamond",serif;font-size:19px;display:block;margin-bottom:5px}
.lock p{margin:0;font-size:13.5px;color:var(--ink2)}
.notice{background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:13px 15px;margin:9px 0}
.notice b{display:block;font-size:14.5px;margin-bottom:3px}
.notice p{margin:0;font-size:13px;color:var(--ink2)}

/* tables */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:10px 0}
.t{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.t.sel{border-color:var(--deep);background:var(--deep-bg)}
.t.full{border-color:var(--ok)}
.t b{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600}
.t span{font-size:11px;color:var(--muted)}

/* zal */
.big{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}
.big div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.big b{display:block;font-family:"Cormorant Garamond",serif;font-size:34px;line-height:1;font-weight:600}
.big span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.est{background:var(--deep);color:#fff;border-radius:16px;padding:16px;text-align:center;margin:10px 0}
.est b{display:block;font-family:"Cormorant Garamond",serif;font-size:42px;line-height:1;font-weight:600}
.est span{font-size:12.5px;opacity:.85;display:block;margin-top:6px}

.note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:20px 10px;line-height:1.6}

/* Переключатель языка и темы — плавающий, доступен с любой вкладки. */
.topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:50;display:flex;gap:6px}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px;
  box-shadow:0 2px 10px rgba(0,0,0,.12)}
.seg button{border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 11.5px Manrope,system-ui,sans-serif;padding:5px 10px;border-radius:16px;letter-spacing:.02em}
.seg button.on{background:var(--deep);color:#fff}
.seg.one button{padding:5px 9px;font-size:13px;line-height:1}
</style>
</head>
<body>
<div class="topbar">
  <div class="seg" id="langseg"></div>
  <div class="seg one"><button id="themebtn" aria-label="theme">◐</button></div>
</div>
<div class="wrap" id="app"><div class="card">…</div></div>
<!-- Ссылка на условия постоянно на экране, а не только в листе согласия:
     организатор вводит имена чужих семей и должен иметь возможность перечитать. -->
<div class="wrap" style="padding-bottom:22px">
  <div style="text-align:center;font-size:12px;color:var(--muted);padding-top:6px">
    <a href="oferta.html" target="_blank" rel="noopener" style="color:var(--muted)" id="footOferta">Условия и обработка данных</a>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const haptic = t => { try { tg?.HapticFeedback?.impactOccurred?.(t || "light"); } catch(e){} };

/* ─── Тема ────────────────────────────────────────────────────────────────
   Три состояния: авто (как в Telegram или в системе), светлая, тёмная.
   Ручной выбор перебивает автоопределение и запоминается. */
const THEME_KEY="td_theme";
function sysDark(){ return tg ? tg.colorScheme==="dark" : !!window.matchMedia?.("(prefers-color-scheme: dark)").matches; }
function applyTheme(){
  const m = localStorage.getItem(THEME_KEY) || "auto";
  const dark = m==="dark" || (m==="auto" && sysDark());
  document.documentElement.dataset.theme = dark ? "dark" : "";
  const b=document.getElementById("themebtn");
  if(b) b.textContent = m==="auto" ? "◐" : (m==="dark" ? "☾" : "☀");
}
function cycleTheme(){
  const m = localStorage.getItem(THEME_KEY) || "auto";
  const next = m==="auto" ? "light" : (m==="light" ? "dark" : "auto");
  localStorage.setItem(THEME_KEY,next); applyTheme(); haptic("light");
}
tg?.onEvent?.("themeChanged", applyTheme);

/* ─── Язык кабинета ───────────────────────────────────────────────────────
   Русский и узбекская латиница. Переключатель висит поверх всех вкладок,
   поэтому язык меняется с любого экрана, а не только из настроек. */
const LANG_KEY="td_org_lang";
/* Порядок такой, и он не косметический.

   1. lang= из адреса. Бот знает язык человека — тот выбрал его сам кнопкой
      «Ру/Oʻz» или командой /til, — и кладёт его в каждую свою кнопку.
      Раньше кабинет этой метки не читал вовсе и брал язык из настроек
      Telegram. У половины телефонов в Узбекистане интерфейс узбекский:
      значит организатор, читавший русское письмо бота и нажавший русскую
      кнопку, попадал в узбекский кабинет — и решал, что ошибся адресом.
      Между письмом и кабинетом стоит ровно то место, где считается
      конверсия, и потеря здесь читается в замере как «продукт плохой».
   2. Сохранённый выбор — если метки нет (открыли по прямой ссылке).
   3. Настройки Telegram — последний запасной вариант, а не первый.

   Пришедшую метку сразу сохраняем: иначе следующий вход без неё вернул бы
   человека на прежний язык, и переключение выглядело бы самопроизвольным. */
let lang = (()=>{
  var u = null;
  try{ u = new URLSearchParams(location.search).get("lang"); }catch(e){}
  if(u==="ru"||u==="uz"){ try{ localStorage.setItem(LANG_KEY,u); }catch(e){} return u; }
  try{ const v=localStorage.getItem(LANG_KEY); if(v==="ru"||v==="uz") return v; }catch(e){}
  return (tg?.initDataUnsafe?.user?.language_code === "uz") ? "uz" : "ru"; })();
const L = () => (window.T_ORG ? T_ORG[lang] : {});
// Подпись под ссылкой на условия живёт в разметке, а не в render(): переводим отдельно.
const footLang = () => { const a=document.getElementById("footOferta");
  if(a && L().footOferta) a.textContent = L().footOferta; };
footLang();
function renderLangSeg(){
  const seg=document.getElementById("langseg");
  seg.innerHTML = [["ru","Ру"],["uz","Oʻz"]].map(([k,t])=>
    `<button data-l="${k}" class="${k===lang?"on":""}">${t}</button>`).join("");
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    lang=b.dataset.l; try{ localStorage.setItem(LANG_KEY,lang); }catch(e){} footLang();
    document.documentElement.lang = lang==="uz" ? "uz" : "ru";
    haptic("light"); renderLangSeg(); S.ev ? render() : renderNew();
  });
}

const API = (window.TOY_API || "https://<project>.functions.supabase.co/toy");
const S = { ev:null, all:[], fams:[], tables:[], gifts:[], tab:"guests", inviteBase:"", inviteLink:"", venueHint:50, selTab:null, onlyPending:false, bulk:false, diff:null, autoseat:null };

const $ = s => document.querySelector(s);
// Кавычки экранируем тоже — как в invite.html. Значения подставляются внутрь
// АТРИБУТОВ (value="${esc(...)}" в полях настроек тоя, семей и книги подарков),
// поэтому без кавычки атрибут разрывается. Ломается это и без злого умысла:
// зал «Тойхона "Зарафшон"» обрезался до «Тойхона » и молча уезжал в базу.
// А второй хозяин тоя, у которого прав меньше, мог через это выполнить код
// в кабинете создателя и добраться до его initData — то есть обойти границу Р-21.
const esc = s => String(s??"").replace(/[<>&"']/g,c=>
  ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
const ORN = `<svg class="orn" viewBox="0 0 96 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M2 11h30M64 11h30" stroke="currentColor" stroke-width="1" opacity=".55"/>

async function call(action, body={}){
  const r = await fetch(`${API}/api/${action}`,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({...body, initData: tg?.initData || ""})});
  return r.json();
}

/* ── R-01 · «Кабинет открыли» — до экрана согласия ───────────────────────────
   Порог вердикта считался по тем, кто уже прошёл согласие, поэтому «не открыл
   приложение» и «открыл и закрыл согласие» были одним числом. Это два разных
   диагноза: первое лечится каналом, второе — продуктом. У Rulchi эта же
   развилка оказалась крупнейшим обрывом всей воронки — почти треть людей.

   Побочно даёт качество канала на второй день закупки: доля дошедших до
   продукта у канала с накрученным охватом падает сразу и заметно.

   Отправляем, не дожидаясь ответа: замер не должен задерживать первый экран.
   Ошибку глотаем — человек не обязан знать, что у нас не записалась метрика.

   from — откуда пришёл: rem7 (напоминание за неделю), nudge, digest, menu.
   Кнопка бота открывает мини-апп по адресу с ?from=…, поэтому метка приходит
   обычным параметром запроса. start_param читаем тоже: он приезжает, когда
   вход был по ссылке t.me/…?startapp=… — это другой путь, и терять его нельзя. */
(function () {
  const q = new URLSearchParams(location.search).get("from") || "";
  const p = tg?.initDataUnsafe?.start_param || "";
  const raw = q || p;
  const from = /^[a-z0-9_]{1,32}$/i.test(raw) ? raw : null;
  call("app_open", from ? { from } : {}).catch(() => {});
})();

/* ── Диалоги ─────────────────────────────────────────────────────────────────
   Внутри Telegram браузерные alert/confirm/prompt выглядят чужеродно, а на части
   Android-клиентов не показываются вовсе — человек жмёт «Удалить» и не понимает,
   почему ничего не произошло. Поэтому везде нативные попапы Telegram, а там, где
   нужно число, — свой степпер: текстового ввода в Telegram-попапах нет. */
function say(msg){
  if(tg?.showAlert) tg.showAlert(String(msg)); else alert(msg);
}
function ask(msg){
  return new Promise(res=>{
    if(tg?.showConfirm) tg.showConfirm(String(msg), ok=>res(!!ok));
    else res(confirm(msg));
  });
}
function askCount(title, sub, value, max){
  return new Promise(res=>{
    const t=L();
    let n = Math.max(0, Math.min(max, value|0));
    const ov=document.createElement("div"); ov.className="sheet-ov";
    ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
      <h2>${esc(title)}</h2><div class="sub">${esc(sub)}</div>
      <div class="stepper">
        <button type="button" id="mn" aria-label="−">−</button>
        <div id="nv" aria-live="polite">${n}</div>
        <button type="button" id="pl" aria-label="+">+</button>
      </div>
      <button class="ok" id="sok">${t.cntSave}</button>
      <button class="more" id="scancel" type="button" style="background:none;border:0;width:100%;cursor:pointer">${t.cntCancel}</button>
    </div>`;
    document.body.appendChild(ov);
    const nv=ov.querySelector("#nv");
    const set=(v)=>{ n=Math.max(0,Math.min(max,v)); nv.textContent=n; haptic("light"); };
    ov.querySelector("#mn").onclick=()=>set(n-1);
    ov.querySelector("#pl").onclick=()=>set(n+1);
    ov.querySelector("#sok").onclick=()=>{ ov.remove(); res(n); };
    ov.querySelector("#scancel").onclick=()=>{ ov.remove(); res(null); };
    ov.onclick=(e)=>{ if(e.target===ov){ ov.remove(); res(null); } };
  });
}
function consentGate(){
  return new Promise(res=>{
    let seen=false; try{ seen=localStorage.getItem("td_consent")==="1"; }catch(e){}
    if(seen) return res();
    const t=CONSENT_TXT[lang]||CONSENT_TXT.ru;
    const ov=document.createElement("div"); ov.className="sheet-ov";
    ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
      <h2>${t.h}</h2><div class="sub">${t.sub}</div>
      <ul>${t.li.map(x=>`<li>${x}</li>`).join("")}</ul>
      <button class="ok" id="cok">${t.ok}</button>
      <a class="more" href="oferta.html" target="_blank" rel="noopener">${t.more}</a></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#cok").onclick=()=>{
      try{ localStorage.setItem("td_consent","1"); }catch(e){}
      ov.remove(); haptic("light"); res();
    };
  });
}
async function boot(){
  await consentGate();
  let events;
  // Пустой экран без объяснения читается как «мои тои пропали». Отличаем
  // «тоёв нет» от «не дозвонились» — это два разных сообщения и два разных действия.
  // Сервер отвечает {error} со статусом 403, не бросая исключение, поэтому одного
  // try/catch мало: без этой проверки экран оставался с многоточием навсегда.
  try {
    const r = await call("my");
    if (!r || r.error) throw new Error(r?.error || "no_response");
    events = r.events;
  }
  catch(e){
    const t=L();
    $("#app").innerHTML=`<div class="card"><b>${t.errNet||"Нет связи"}</b>
      <div class="note" style="margin:6px 0 12px">${t.errNetHint||"Проверьте интернет и попробуйте ещё раз."}</div>
      <button class="b" id="retry">${t.retry||"Повторить"}</button></div>`;
    $("#retry").onclick=()=>boot();
    return;
  }
  S.all = events || [];
  if(!S.all.length) return renderNew();
  const last = Number(localStorage.getItem("td_last_event")||0);
  const pick = S.all.find(e=>e.id===last) || S.all[0];
  await open(pick.id);
}

async function open(id){
  const d = await call("event_get",{event_id:id});
  if(d.error) return say(L().errAccess);
  S.ev=d.event; localStorage.setItem("td_last_event", String(id)); S.fams=d.families; S.tables=d.tables; S.gifts=d.gifts; S.wishes=d.wishes||0; S.inviteBase=d.invite_base; S.inviteLink=d.invite_link||`${d.invite_base}?t={token}`; S.venueHint=d.venue_hint||50;

  // Итог авто-раскладки принадлежит конкретному тою: у другого и столы другие.
  S.bulk=false; S.onlyPending=false; S.autoseat=null;
  // Список тоёв держим свежим: после создания нового он должен появиться в переключателе.
  const idx=(S.all||[]).findIndex(e=>e.id===d.event.id);
  if(idx>=0) S.all[idx]=d.event; else S.all=[d.event, ...(S.all||[])];
  render();
}
function counts(){
  const inv=S.fams.reduce((a,f)=>a+(f.invited_count||0),0);
  const yes=S.fams.filter(f=>f.rsvp_status==="yes").reduce((a,f)=>a+(f.rsvp_count||0),0);
  const no=S.fams.filter(f=>f.rsvp_status==="no").length;
  const pend=S.fams.filter(f=>f.rsvp_status==="pending");
  return {inv,yes,no,pend,pendInv:pend.reduce((a,f)=>a+(f.invited_count||0),0)};
}
/* ── Деньги ──────────────────────────────────────────────────────────────────
   Продукт считал людей, а тойхона берёт деньги за МЕСТА — и берёт их за
   приглашённых, а не за пришедших. Пока на экране «53 человека», это статистика.
   «Молчат 8 семей = 19 мест = 2 280 000 сум, которые вы оплатите в любом случае» —
   это причина сегодня разослать напоминания, а завтра купить Premium.

   Считаем честно и в обе стороны: сколько уже насчитано и сколько снимется,
   если молчащие ответят «не сможем». Второе число — то, ради чего человек
   возвращается в приложение. */
// Ташкент, 2026: место в тойхоне стоит от 200 до 800 тысяч, в залах при отелях
// доходит до трёх миллионов. Медиана ближе к 250. Осторожно с цифрами из поиска:
// первой по «toʻyxona narxlari» выходит статья 2019 года, где всё в 3–5 раз дешевле.
const SEAT_PRICE_DEFAULT = 250000;
function seatPrice(){
  const v = Number(S.ev.seat_price_uzs);
  return Number.isFinite(v) && v > 0 ? v : SEAT_PRICE_DEFAULT;
}
function money(){
  const c = counts(), p = seatPrice();
  // Тойхона считает молчащих по числу приглашённых: пока семья не отказалась,
  // места за ней держат и выставляют в счёт.
  const seats = c.yes + c.pendInv;
  return {
    price: p,
    yes: c.yes, yesSum: c.yes * p,
    risk: c.pendInv, riskSum: c.pendInv * p, riskFams: c.pend.length,
    seats, total: seats * p,
    // Средняя цена одного молчащего ответа: столько снимется со счёта, если
    // семья скажет «не сможем». Это перевод кнопки «напомнить» в сумы.
    perFam: c.pend.length ? Math.round(c.pendInv / c.pend.length) * p : 0,
  };
}
const uzs = (n) => Math.round(n).toLocaleString("ru").replace(/\u00A0/g, " ");

/* ── G-06. Шапка кабинета говорит, что за той ───────────────────────────────
   Повод сквозной: он лежит в базе, задаёт текст приглашения и тему оформления.
   А шапка была одна на всё — бешик-той открывался экраном, неотличимым от
   свадьбы. Это не косметика: свадьбы идут двумя сезонами, а бешик, суннат
   и юбилей — круглый год, и именно ими продукт живёт вне сезона. Человек,
   пришедший с бешик-тоем, должен с первого экрана видеть, что попал в своё,
   а не «ну, тут вообще-то про свадьбы».

   Подпись берём из invite-texts.js — того же файла, откуда её берут тексты
   приглашения: две копии списка поводов разъехались бы за неделю (Р-25). */
function occLabel(occasion){
  const o = window.toyOccasion ? toyOccasion(occasion || "nikoh_toy") : null;
  return (o && o.label && o.label[lang === "uz" ? "uz_latin" : "ru"]) || "";
}
function daysLeft(){ if(!S.ev.event_date) return null;
  return Math.ceil((new Date(S.ev.event_date) - new Date())/864e5); }

/* ── G-03. Уведомление махалли ──────────────────────────────────────────────
   Организатор обязан сообщить о тое в махаллинский сход граждан не позднее
   чем за неделю. Основание — Низом, утверждённый совместным постановлением
   Кенгашей Законодательной палаты и Сената Олий Мажлиса № 2736-III от
   14.09.2019 (действует с 01.01.2020). Про договор с тойхоной помнят все:
   его требует сам зал. Про махаллю не напоминает никто, потому что это
   единственная обязанность, у которой нет заинтересованной стороны.

   Считаем дату сами и печатаем её в счёте для зала: «за неделю» в голове
   превращается в «на днях», а конкретное число — в дело на сегодня. И это
   то, чем наш счёт отличается от таблицы, которую зал попросил бы сделать
   в Excel: один лист закрывает обе обязанности сразу.

   Полдень берём нарочно: от «за семь суток» нас интересует календарная дата,
   и с полудня ни переход через месяц, ни часовой пояс её не сдвигают.

   Месяц пишем сами, а не через toLocaleDateString: локаль uz-UZ выдаёт
   «2026 M10 31», и срок, названный законом, выглядел бы машинным мусором.
   Сама таблица месяцев и формат переехали в zal.js: ими пользуется ещё
   и счёт для зала, где до этого стоял Intl и узбекоязычный организатор
   нёс администратору бумагу с «2026 M10 18». */
function mahDate(){
  return toyDateLong(S.ev && S.ev.event_date, lang, { shiftDays: -7 });
}

/* ---------- гости ---------- */
// Разбор вставленного списка. Набор 60 семей по одной — это точка отвала №1:
// человек бросает кабинет на пятнадцатой строке. Здесь он вставляет всё разом.
/* ─── Обмен списком с Excel ──────────────────────────────────────────────────
   Круг: выгрузил → поправил в Excel → загрузил обратно → проверил → применил.
   Формат наш: первая колонка ID, по ней при загрузке узнаём, что это та же семья,
   а не новая. Строку без ID считаем добавлением — значит список можно дописывать
   прямо в Excel, не выдумывая никаких идентификаторов.                          */

// Разбор одной CSV/TSV-строки с учётом кавычек: в пожелании гостя бывает и «;», и перевод строки.
function splitRow(line, sep){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out.map(s=>s.trim());
}
/* A-11 · Формулы в выгрузке. Пожелание гостя, начинающееся с «=», «+», «-» или
   «@», Excel открывает не как текст, а как формулу — и открывает файл ХОЗЯИН
   тоя, на своей машине. Пишет строку гость, выполняется она у хозяина: путь тот
   же, что у XSS, только через Excel.

   Гасим ведущий символ апострофом и ячейку после этого всегда берём в кавычки,
   чтобы апостроф не склеился с разделителем. Чистые числа не трогаем: «-500»
   с апострофом перестаёт быть числом, а суммы подарков здесь складывают —
   опасен не минус, а минус перед формулой.

   Обычные функции, а не стрелки: этот кусок гоняется отдельной проверкой,
   и она умеет ES5. */
var CSV_NUM=/^-?\d+([.,]\d+)?$/;
function csvSafe(s){
  if(CSV_NUM.test(s)) return s;
  return /^[=+\-@\t\r]/.test(s) ? "'"+s : s;
}
function csvCell(v){
  var raw=String(v==null?"":v);
  var s=csvSafe(raw);
  return (s!==raw || /[";\n\r]/.test(s)) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
// Заголовки принимаем на обоих языках и в любом регистре — файл мог прийти от зала или от тамады.
const COL_ALIASES = {
  id:      ["id","№","номер"],
  name:    ["семья","oila","название","nomi","family"],
  side:    ["сторона","tomon"],
  invited: ["приглашено","taklif qilingan","приглашённых","invited"],
  status:  ["статус","holat","status"],
  count:   ["придут","keladi","придёт","count"],
  table:   ["стол","stol","table"],
  note:    ["пожелание","tilak","заметка","note"],
};
function colIndex(header){
  const idx={};
  header.forEach((h,i)=>{
    const low=String(h).toLowerCase().replace(/^﻿/,"").trim();
    for(const key in COL_ALIASES) if(COL_ALIASES[key].some(a=>low===a||low.startsWith(a))) idx[key]=i;
  });
  return idx;
}
const YES_WORDS=["придут","да","yes","keladi","ha","+"];
const NO_WORDS =["отказ","нет","no","kelolmaydi","yoʻq","yoq","-"];
function normStatus(v){
  const s=String(v||"").toLowerCase().trim();
  if(!s) return "pending";
  if(YES_WORDS.some(w=>s.startsWith(w))) return "yes";
  if(NO_WORDS.some(w=>s.startsWith(w)))  return "no";
  return "pending";
}
function normSide(v){
  const s=String(v||"").toLowerCase();
  return /кел|kelin|невест/.test(s) ? "kelin" : "kuyov";
}

// Один вход для двух способов: и таблица из Excel, и быстрая вставка «Каримовлар — 6».
function parseGuests(text){
  const raw = String(text||"").replace(/\r\n?/g,"\n").split("\n").filter(l=>l.trim()!=="");
  if(!raw.length) return {rows:[], mode:"empty"};

  // Разделитель определяем по первой строке: из Excel копируют табами, файл сохраняют с «;».
  const first = raw[0];
  const sep = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const looksTable = first.includes("\t") || first.includes(";") || first.includes(",");
  if(looksTable){
    const head = splitRow(first, sep);
    const idx = colIndex(head);
    // Если шапки нет — считаем, что первая строка уже данные, а колонки идут в нашем порядке.
    const hasHeader = idx.name !== undefined || idx.id !== undefined;
    const body = hasHeader ? raw.slice(1) : raw;
    const map = hasHeader ? idx : {id:0,name:1,side:2,invited:3,status:4,count:5,table:6,note:7};
    const rows = body.map(line=>{
      const c = splitRow(line, sep);
      // A-11, обратная сторона: на выгрузке мы гасим ведущий «=» апострофом.
      // Excel этот апостроф съедает сам, а LibreOffice и «Google Таблицы»
      // возвращают его буквой — и круг «выгрузил → поправил → загрузил» копил
      // бы по апострофу за проход. Снимаем ровно тот, что поставили сами.
      const unq = s => String(s ?? "").replace(/^'(?=[=+\-@])/, "");
      const get = k => map[k]!==undefined ? unq(c[map[k]] ?? "") : "";
      const name = String(get("name")).trim();
      if(!name) return null;
      const invited = Math.max(1, Math.min(50, parseInt(get("invited"),10) || 2));
      const status = normStatus(get("status"));
      const cnt = parseInt(get("count"),10);
      return {
        id: parseInt(get("id"),10) || null,
        name: name.slice(0,80),
        invited_count: invited,
        side: normSide(get("side")),
        rsvp_status: status,
        rsvp_count: status==="yes" ? (isNaN(cnt)?invited:Math.max(0,Math.min(60,cnt))) : 0,
        rsvp_note: String(get("note")||"").slice(0,300) || null,
      };
    }).filter(Boolean);
    return {rows, mode:"table"};
  }

  // Быстрая вставка: одна семья — одна строка, хвостовое число = сколько человек.
  const rows = raw.map(line=>{
    const s=line.trim();
    const m = s.match(/^(.*?)[\s—–\-:•·]*(\d{1,3})\s*(?:чел\.?|kishi|киши|нафар)?\s*$/i);
    let name = (m ? m[1] : s).replace(/[\s—–\-:.,;•·]+$/,"").trim();
    const n = m ? Math.max(1, Math.min(50, parseInt(m[2],10))) : 2;
    if(!name) name = s;
    return { id:null, name:name.slice(0,80), invited_count:n, side:"kuyov",
             rsvp_status:"pending", rsvp_count:0, rsvp_note:null };
  }).filter(r=>r.name);
  return {rows, mode:"lines"};
}

// Выгрузка в нашем формате. Разделитель «;» и BOM — Excel в русской локали
// открывает такой файл двойным щелчком, без мастера импорта.
function giftsCsv(){
  const t=L();
  const head=[t.fFamily, t.fWhat, t.fAmount, t.date];
  const body=S.gifts.map(g=>{
    const f=S.fams.find(x=>x.id===g.family_id);
    return [f?f.name:"", g.gift_text||"", g.amount_uzs??"", String(g.created_at||"").slice(0,10)]
      .map(csvCell).join(";");
  });
  return "﻿"+[head.map(csvCell).join(";"), ...body].join("\r\n");
}
function guestsCsv(){
  const t=L();
  const head=["ID",t.zThFamily,t.gSide,t.stInvited,t.zThStatus,t.stYes,t.zDocTable("").trim()||"Стол",t.fWhat];
  const st={yes:t.zStYes,no:t.zStNo,pending:t.zStPending};
  const body=S.fams.map(f=>{
    const tb=S.tables.find(x=>x.id===f.table_id);
    return [f.id, f.name, f.side==="kelin"?t.zKelin:t.zKuyov, f.invited_count,
            st[f.rsvp_status]||"", f.rsvp_status==="yes"?f.rsvp_count:"",
            tb?tb.num:"", f.rsvp_note||""].map(csvCell).join(";");
  });
  return "﻿"+[head.map(csvCell).join(";"), ...body].join("\r\n");
}
/* Сверка загруженного с тем, что уже есть. Ничего не применяем, пока человек не увидел,
   что именно поменяется: список гостей на тое — вещь, которую страшно перезаписать вслепую. */
function buildDiff(rows){
  const byId = new Map(S.fams.map(f=>[f.id,f]));
  const byName = new Map(S.fams.map(f=>[f.name.toLowerCase().trim(),f]));
  const seen = new Set();
  const items = rows.map((r,i)=>{
    // Совпадение по ID надёжнее; если ID нет — пробуем по названию, чтобы повторная
    // загрузка того же файла не наплодила дублей.
    let cur = r.id ? byId.get(r.id) : byName.get(r.name.toLowerCase().trim());
    if(cur && seen.has(cur.id)) cur = null;
    if(cur) seen.add(cur.id);
    const changes=[];
    if(cur){
      if(cur.name!==r.name) changes.push("name");
      if(cur.invited_count!==r.invited_count) changes.push("invited_count");
      if(cur.side!==r.side) changes.push("side");
      if(cur.rsvp_status!==r.rsvp_status) changes.push("rsvp_status");
      if((cur.rsvp_status==="yes"||r.rsvp_status==="yes") && cur.rsvp_count!==r.rsvp_count) changes.push("rsvp_count");
      if((cur.rsvp_note||"")!==(r.rsvp_note||"")) changes.push("rsvp_note");
    }
    return { i, row:{...r, id: cur?cur.id:null}, cur: cur||null,
             kind: cur ? (changes.length?"upd":"same") : "new",
             changes, on: cur ? changes.length>0 : true };
  });
  const missing = S.fams.filter(f=>!seen.has(f.id));
  return { items, missing };
}
function diffCard(){
  const t=L(), d=S.diff;
  const nNew=d.items.filter(x=>x.kind==="new").length;
  const nUpd=d.items.filter(x=>x.kind==="upd").length;
  const nSame=d.items.filter(x=>x.kind==="same").length;
  const willApply=d.items.filter(x=>x.on);
  const sideName=s=>s==="kelin"?t.gSideKelin:t.gSideKuyov;
  const stName=s=>s==="yes"?t.zStYes:s==="no"?t.zStNo:t.zStPending;
  const badge=k=>k==="new"
    ? `<span class="pill yes">${t.impNew}</span>`
    : k==="upd" ? `<span class="pill pending">${t.impUpd}</span>`
                : `<span class="pill" style="background:var(--line2);color:var(--muted)">${t.impSame}</span>`;
  const was=(x)=>{
    if(x.kind!=="upd") return "";
    const parts=x.changes.map(ch=>{
      if(ch==="name") return `${x.cur.name} → ${x.row.name}`;
      if(ch==="invited_count") return `${t.stInvited}: ${x.cur.invited_count} → ${x.row.invited_count}`;
      if(ch==="side") return `${sideName(x.cur.side)} → ${sideName(x.row.side)}`;
      if(ch==="rsvp_status") return `${stName(x.cur.rsvp_status)} → ${stName(x.row.rsvp_status)}`;
      if(ch==="rsvp_count") return `${t.stYes}: ${x.cur.rsvp_count} → ${x.row.rsvp_count}`;
      return t.fWhat;
    });
    return `<div class="wish" style="border-color:var(--warn)">${esc(parts.join(" · "))}</div>`;
  };
  const rows=d.items.map(x=>`
    <div class="fam" data-i="${x.i}" style="margin:6px 0;${x.kind==="same"?"opacity:.55":""}">
      <div class="r1">
        <label style="display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer;margin:0;
          color:var(--ink);font-size:14px;font-weight:400;text-transform:none;letter-spacing:0;flex:1">
          <input type="checkbox" class="dchk" data-i="${x.i}" ${x.on?"checked":""}
            style="width:19px;height:19px;accent-color:var(--ok);margin-top:2px">
          <span>
            <input class="dname" data-i="${x.i}" value="${esc(x.row.name)}"
              style="padding:6px 8px;font-size:14px;font-weight:600;margin-bottom:5px">
            <span class="sb">${sideName(x.row.side)} · ${t.stInvited}: </span>
            <input class="dcnt" data-i="${x.i}" type="number" min="1" max="50" value="${x.row.invited_count}"
              style="width:62px;padding:4px 6px;font-size:13px;display:inline-block">
          </span>
        </label>
        ${badge(x.kind)}
      </div>
      ${was(x)}
    </div>`).join("");
  const missBlock = d.missing.length ? `<div class="notice" style="margin-top:10px">
      <b>${t.impMissing(d.missing.length)}</b>
      <p>${t.impMissingNote}</p>
      <div class="note" style="margin-top:6px">${d.missing.slice(0,8).map(f=>esc(f.name)).join(" · ")}${d.missing.length>8?" …":""}</div>
    </div>` : "";
  const total = willApply.reduce((a,x)=>a+x.row.invited_count,0)
    + S.fams.filter(f=>!willApply.some(x=>x.row.id===f.id)).reduce((a,f)=>a+(f.invited_count||0),0);
  return `<div class="card"><b>${t.impCheckTitle}</b>
    <div class="note" style="margin:0 0 4px">${t.impSummary(nNew,nUpd,nSame)}</div>
    <div class="note" style="margin:0 0 10px">${t.impTotal(total)}</div>
    ${rows}
    ${missBlock}
    <button class="b" id="applyImp">${t.impApply(willApply.length)}</button>

    <button class="b sec" id="cancelImp">${t.gBulkCancel}</button></div>`;
}

    haptic("medium"); say(t.cpDone(r.created, r.skipped)); render();
  });
  $("#seatPrice") && ($("#seatPrice").onchange=async()=>{
    const v = Math.max(0, +$("#seatPrice").value || 0);
    S.ev.seat_price_uzs = v || null;
    await call("event_save", { event: { id:S.ev.id, seat_price_uzs: v || null } });
    haptic("light"); render();
  });
  $("#sendAll") && ($("#sendAll").onclick=()=>startQueue(S.onlyPending ? "remind" : "first"));
  $("#sendMoved") && ($("#sendMoved").onclick=()=>startQueue("moved"));
  $("#sendThanks") && ($("#sendThanks").onclick=()=>startQueue("thanks"));
  $("#buyP") && ($("#buyP").onclick=()=>pay("premium"));
  $("#remind") && ($("#remind").onclick=()=>{S.onlyPending=!S.onlyPending;render();});
  // A-21: отметку «отправлено» ставит человек, а не нажатие кнопки.
  $("#psYes") && ($("#psYes").onclick=()=>{ haptic("medium"); confirmSent(pendingFams().map(f=>f.id)); });
  $("#psNo")  && ($("#psNo").onclick =()=>{ haptic("light");  declineSent(pendingGet()); });
  $("#bulkToggle").onclick=()=>{S.bulk=!S.bulk;S.diff=null;haptic("light");render();};
  $("#bulkCancel") && ($("#bulkCancel").onclick=()=>{S.bulk=false;S.diff=null;render();});
  $("#exportX").onclick=()=>{
    haptic("light");
    dl(`${t.zCsvFile}${(S.ev.couple||"toy").replace(/\s+/g,"_")}.csv`, guestsCsv(), "text/csv");
  };
  // Файл читаем в textarea, чтобы человек увидел, что именно загрузилось,
  // и мог поправить прямо здесь, если Excel сохранил что-то не так.

    const f=e2.target.files?.[0]; if(!f) return;

    rd.onload=()=>{ $("#bulkText").value=String(rd.result||"").replace(/^﻿/,""); haptic("light"); };
    rd.readAsText(f,"utf-8");
  });
  $("#bulkGo") && ($("#bulkGo").onclick=()=>{
    const {rows,mode}=parseGuests($("#bulkText").value);
    if(!rows.length) return tg?.showAlert?.(t.gBulkNone);
    const side=$("#bulkSide").value;
    // Сторону из выпадающего списка применяем только к быстрой вставке:
    // в таблице она своя в каждой строке, и перетирать её нельзя.
    if(mode==="lines") rows.forEach(r=>r.side=side);
    S.diff = buildDiff(rows);
    haptic("medium"); render();
  });

  // Экран проверки: правки применяются к загруженным строкам, а не к базе,
  // пока человек не нажмёт «Применить».
  if(S.diff){
    const find=i=>S.diff.items.find(x=>x.i===+i);
    document.querySelectorAll(".dchk").forEach(el=>el.onchange=()=>{
      const x=find(el.dataset.i); if(x){ x.on=el.checked; render(); } });
    document.querySelectorAll(".dname").forEach(el=>el.onchange=()=>{
      const x=find(el.dataset.i); if(x) x.row.name=el.value.trim().slice(0,80); });
    document.querySelectorAll(".dcnt").forEach(el=>el.onchange=()=>{
      const x=find(el.dataset.i); if(x){ x.row.invited_count=Math.max(1,Math.min(50,+el.value||1)); render(); } });
    $("#cancelImp").onclick=()=>{ S.diff=null; render(); };
    $("#applyImp").onclick=async()=>{
      const btn=$("#applyImp"); btn.disabled=true; btn.textContent=t.impApplying;
      const rows=S.diff.items.filter(x=>x.on).map(x=>x.row);
      let r=null;
      try { r=await call("families_bulk",{event_id:S.ev.id,rows}); } catch(e){}

      if(!r?.families){ btn.disabled=false; btn.textContent=t.impApply(rows.length);
        return tg?.showAlert?.(t.errAccess); }
      S.fams=r.families; S.diff=null; S.bulk=false; haptic("medium"); render();
      tg?.showAlert?.(t.impDone(r.created,r.updated));
    };
  }

  const shown = S.onlyPending ? S.fams.filter(f=>f.rsvp_status==="pending") : S.fams;
  const list=$("#list");
  if(!shown.length){ list.innerHTML=`<div class="empty">${S.onlyPending?t.gEmptyAnswered:t.gEmptyNone}</div>`; return; }
  list.innerHTML = shown.map(f=>{
    const tb=S.tables.find(x=>x.id===f.table_id);
    return `<div class="fam" data-id="${f.id}">
      <div class="r1">
        <div><div class="nm">${esc(f.name)}</div>
          <div class="sb">${t.gPeople(f.invited_count)} · ${f.side==="kelin"?t.gFromKelin:t.gFromKuyov}${tb?t.gTable(tb.num):""}${
          f.sent_at?` · <span style="color:var(--ok)">${t.gSent}</span>`:""}${
          f.opened_at&&f.rsvp_status==="pending"?` · <span style="color:var(--warn)">${t.gOpened}</span>`:""}</div></div>
        <span class="pill ${f.rsvp_status}">${f.rsvp_status==="yes"?t.gPillYes(f.rsvp_count):f.rsvp_status==="no"?t.gPillNo:t.gPillPending}</span>
      </div>
      ${f.rsvp_note?`<div class="wish">${esc(f.rsvp_note)}</div>`:""}
      <div class="acts">
        <button class="pri" data-a="send">${f.rsvp_status==="pending"&&S.onlyPending?t.gBtnRemind:f.sent_at?t.gBtnAgain:t.gBtnSend}</button>
        <button data-a="mark">✍️</button><button data-a="copy">🔗</button>${
          S.ev.tier==="free"?"":`<button data-a="print" title="${t.pInvBtn}">🖼</button>`
        }<button data-a="del">🗑️</button>
      </div></div>`;
  }).join("");
  list.querySelectorAll(".fam").forEach(el=>{
    const f=S.fams.find(x=>x.id==el.dataset.id);
    const link=S.inviteLink.replace("{token}", f.token);
    el.querySelector('[data-a="copy"]').onclick=()=>{navigator.clipboard?.writeText(link);haptic("light");tg?.showAlert?.(t.gCopied);};
    // Тётя позвонила и сказала голосом — ответ всё равно должен попасть в счёт для зала.
    // Без этого треть родни в цифру не попадает и «счёт для зала» неполный.
    el.querySelector('[data-a="mark"]').onclick=async()=>{
      const n = await askCount(f.name, t.gPromptMark(f.name), f.rsvp_count || f.invited_count, f.invited_count + 4);
      if(n === null) return;
      const status = n > 0 ? "yes" : "no";
      const r = await call("family_update",{event_id:S.ev.id,family_id:f.id,rsvp_status:status,rsvp_count:n});
      if(r.family){ Object.assign(f, r.family); haptic("medium"); render(); }
    };
    el.querySelector('[data-a="send"]').onclick=()=>shareTo(f, (f.rsvp_status==="pending"&&S.onlyPending) ? "remind" : "first");
    // Печатное приглашение делается для КОНКРЕТНОЙ семьи: QR ведёт на её ответ,
    // иначе тойхона получит число без этих гостей.
    el.querySelector('[data-a="print"]')?.addEventListener("click", ()=>{ haptic("medium"); invitePng(f); });
    el.querySelector('[data-a="del"]').onclick=async()=>{ if(!await ask(t.gConfirmDel(f.name)))return;
      await call("family_delete",{event_id:S.ev.id,family_id:f.id}); S.fams=S.fams.filter(x=>x.id!==f.id); render(); };
  });
}

/* ── Отправка приглашения ────────────────────────────────────────────────────
   Массовой рассылки в Telegram нет и быть не может: t.me/share требует выбрать
   чат на каждую семью руками. Поэтому задача не «отправить пачкой», а провести
   человека по списку — раньше при 60 семьях он 60 раз выходил из мини-аппа
   и заново искал, на ком остановился. */
function shareText(f, kind){
  // Сообщение уходит на языке ПРИГЛАШЕНИЯ, а не кабинета: его читает гость.
  const il = S.ev.lang || "uz_latin";
  const dt = `${S.ev.event_date ? new Date(S.ev.event_date).toLocaleDateString(il === "ru" ? "ru-RU" : "uz-UZ") : ""} ${S.ev.event_time || ""}`.trim();
  const occ = (window.toyOccasion ? toyOccasion(S.ev.occasion || "nikoh_toy") : null);
  const tpl = occ?.share?.[kind]?.[il];
  return tpl
    ? (window.toyFill ? toyFill(tpl, { ...S.ev, dateStr: dt }) : tpl)
    : `${S.ev.greeting || ""}\n\n${S.ev.couple}\n${dt}\n${S.ev.venue_name || ""}`;
}
/* ── A-21. «Отправлено» ставится с ваших слов, а не по нажатию ───────────────
   Между нажатием и ушедшим приглашением стоит чужой экран — выбор чата в
   Telegram. Его закрывают: промахнулись, передумали, позвонили. Раньше отметка
   уходила в базу до этого экрана, и отменённая отправка выглядела как
   состоявшаяся.

   Цена ошибки здесь не косметическая. Семья с `sent_at` выпадает из очереди
   «кому ещё не отправляли» и больше в неё не возвращается — то есть гость
   теряется молча и навсегда. При этом место за ним продолжает считаться
   в счёте для зала как «молчит», и организатор платит за стул, приглашения
   на который не было. Он же видит «разослано 40» и по этой цифре бронирует зал.

   Поэтому в базу пишем только то, что человек подтвердил. Ошибиться можно
   в обе стороны, но неотмеченная семья просто снова появится в очереди —
   а отмеченная по ошибке исчезает. Выбираем ту сторону, где потери нет.

   Список ждущих подтверждения лежит в localStorage, а не только в памяти:
   openTelegramLink на части клиентов закрывает мини-апп целиком, и без этого
   вопрос «отправили?» пропал бы вместе со страницей. */
const pendKey = () => `td_pending_sent_${S.ev && S.ev.id}`;
function pendingGet(){
  try{ const a = JSON.parse(localStorage.getItem(pendKey()) || "[]"); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function pendingSet(a){ try{ localStorage.setItem(pendKey(), JSON.stringify(a.slice(-300))); }catch(e){} }
function pendingAdd(id){ const a = pendingGet(); if(!a.includes(id)){ a.push(id); pendingSet(a); } }
function pendingDrop(ids){ const s = new Set(ids); pendingSet(pendingGet().filter(x => !s.has(x))); }
// Ждут ответа только те, кого ещё не отметили: остальное — след прошлых заходов
// и удалённых семей, и показывать его незачем.
function pendingFams(){
  return pendingGet().map(id => S.fams.find(f => f.id === id)).filter(f => f && !f.sent_at);
}
async function confirmSent(ids){
  pendingDrop(ids);
  const fresh = ids.filter(id => { const f = S.fams.find(x => x.id === id); return f && !f.sent_at; });
  const now = new Date().toISOString();
  fresh.forEach(id => { const f = S.fams.find(x => x.id === id); if(f) f.sent_at = now; });
  render();
  if(fresh.length) await call("mark_sent", { event_id: S.ev.id, family_ids: fresh });
}
function declineSent(ids){ pendingDrop(ids); render(); }
// Полоса подтверждения в списке гостей. Ловит два случая: отправку из строки
// семьи (там очереди нет) и возврат в кабинет после того, как мини-апп закрылся.
function pendingStrip(){
  const t = L(), list = pendingFams();
  if(!list.length) return "";
  return `<div class="notice" id="pstrip">
    <b>${t.psTitle}</b>
    <p>${t.psText(list.length)}</p>
    <p style="margin-top:5px"><b>${list.slice(0,8).map(f=>esc(f.name)).join(", ")}${list.length>8?" …":""}</b></p>
    <div class="row2" style="margin-top:9px">
      <button class="b" id="psYes" style="margin:0">${t.psYes}</button>
      <button class="b sec" id="psNo" style="margin:0">${t.psNo}</button>
    </div></div>`;
}

function shareTo(f, kind){
  const link = S.inviteLink.replace("{token}", f.token);
  // Отмечаем только первую отправку. Напоминание, перенос и благодарность идут по
  // тем же семьям — «когда отправили приглашение» от них меняться не должно.
  if(!f.sent_at) pendingAdd(f.id);
  haptic("medium");
  const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(shareText(f, kind))}`;
  tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url);
  // Перерисовываем, чтобы вопрос «отправили?» встретил человека сразу по возвращении.
  setTimeout(() => render(), 400);
}
// Кому что уходит:
//   first  — кому ещё не отправляли
//   remind — отправили, но молчат
//   moved  — всем, кто уже получил приглашение: дата изменилась, ссылка та же
//   thanks — тем, кто пришёл; появляется только после тоя
function inQueue(f, kind){
  if(kind === "remind") return !!f.sent_at && f.rsvp_status === "pending";
  if(kind === "moved")  return !!f.sent_at;
  if(kind === "thanks") return f.rsvp_status === "yes";
  return !f.sent_at;
}
// «Спасибо» до тоя — бессмыслица, «перенесли» без даты — тоже: в тексте {{date}}.
function queueAllowed(kind){
  if(kind === "thanks") return !!S.ev.event_date && S.ev.event_date < new Date().toISOString().slice(0,10);
  if(kind === "moved")  return !!S.ev.event_date;
  return true;
}
function queueSize(kind){
  return queueAllowed(kind) ? S.fams.filter(f => inQueue(f, kind)).length : 0;
}
function startQueue(kind){
  S.sendKind = kind;
  S.sendAsk = null;
  S.sendDone = new Set();
  S.sendQueue = S.fams.filter(f => inQueue(f, kind)).map(f => f.id);
  S.tab = "send"; haptic("light"); render();
}
function tabSend(){
  const t = L();
  const kind = S.sendKind || "first";
  // Очередь снимается один раз при входе. Иначе «12 из 60» будет прыгать:
  // отправленные уходят из выборки, и знаменатель тает на глазах.
  if(!S.sendQueue){ S.tab = "guests"; return render(); }
  const total = S.sendQueue.length;
  const byId = new Map(S.fams.map(f => [f.id, f]));
  const queue = (S.sendQueue || []).map(id => byId.get(id)).filter(f => f && !S.sendDone.has(f.id));
  const done = total - queue.length;
  // A-21. Очередь не идёт дальше сама: следующая семья открывается ответом
  // на прямой вопрос. Один тап вместо потерянного гостя — размен честный.
  if(S.sendAsk != null && byId.get(S.sendAsk)){
    const af = byId.get(S.sendAsk);
    $("#tab").innerHTML = `
    <div class="card">
      <div class="note" style="margin:0 0 8px">${t.qProgress(done, total)}</div>
      <b>${t.qAskTitle}</b>
      <div style="font-family:var(--display,'Cormorant Garamond',serif);font-size:22px;font-weight:600;margin-top:6px">${esc(af.name)}</div>
      <div class="note" style="margin:6px 0 14px">${t.qAskText}</div>
      <button class="b" id="askYes">${t.qAskYes}</button>
      <button class="b sec" id="askNo">${t.qAskNo}</button>
    </div>`;
    $("#askYes").onclick=()=>{ haptic("medium"); S.sendDone.add(af.id); S.sendAsk=null; confirmSent([af.id]); };
    $("#askNo").onclick =()=>{ haptic("light");  S.sendAsk=null; declineSent([af.id]); };
    return;
  }
  S.sendAsk = null;
  if(!queue.length){
    $("#tab").innerHTML = `<div class="card"><b>${t.qDoneTitleFor(kind)}</b>
      <div class="note" style="margin-top:6px">${t.qDoneText(done)}</div>
      <button class="b sec" id="back">${t.qBack}</button></div>`;
    $("#back").onclick=()=>{S.tab="guests";render();};
    return;
  }
  const f = queue[0];
  const pct = Math.round(100 * done / Math.max(1, total));
  $("#tab").innerHTML = `
  <div class="card">
    <div class="note" style="margin:0 0 8px">${t.qProgress(done, total)}</div>
    <div style="height:6px;border-radius:4px;background:var(--line2);overflow:hidden;margin-bottom:14px">
      <div style="height:100%;width:${pct}%;background:var(--gold)"></div></div>
    <div style="font-family:var(--display,'Cormorant Garamond',serif);font-size:22px;font-weight:600">${esc(f.name)}</div>
    <div class="note" style="margin:2px 0 14px">${t.gCount}: ${f.invited_count}</div>
    <button class="b" id="go">${t.qSendFor(kind)}</button>
    <div class="row2" style="margin-top:8px">
      <button class="b sec" id="skip" style="margin:0">${t.qSkip}</button>
      <button class="b sec" id="stop" style="margin:0">${t.qStop}</button>
    </div>
    <div class="note" style="margin-top:10px">${t.qHint}</div>
  </div>`;
  // Отмечаем отправленной и сразу показываем следующую: возвращаться из чата
  // человек будет уже на неё, а не на начало списка.
  // В sendDone семья попадёт только после подтверждения: до него она остаётся
  // текущей, и повторное нажатие «отправить» ничего не портит.
  $("#go").onclick=()=>{ S.sendAsk = f.id; shareTo(f, kind); };
  $("#skip").onclick=()=>{ S.sendDone.add(f.id); haptic("light"); render(); };
  $("#stop").onclick=()=>{ S.tab="guests"; S.sendAsk=null; render(); };
}

/* ── Авто-раскладка по столам ────────────────────────────────────────────────
   Premium обещает «рассадку без бумажек», но руками это два касания на каждую
   семью: выбрать стол, нажать семью. На трёхстах семьях — шестьсот касаний,
   то есть на реальном объёме обещание не выполняется вовсе, а рассадка входит
   в платный тариф.

   Почему алгоритм именно такой:

   • Семья неделима. Тойхона считает деньги за места, но за стол садится род,
     и «Каримовлар оиласи» пополам между шестым и седьмым столом — это скандал,
     а не экономия двух стульев. Сажаем целиком либо не сажаем вовсе.

   • Стороны врозь. Келин томон и куёв томон — две разные родни. Келин занимает
     ряд столов с начала, куёв — с конца; сходятся они в середине зала и
     перемешиваются только тогда, когда мест впритык и выбора уже нет.

   • Большие семьи первыми (first-fit-decreasing). Если начать с мелких, семья
     из девяти человек не влезет никуда при куче свободных мест по три.

   • Плотно, но без перелива. Из подходящих столов берём тот, где после посадки
     останется меньше всего свободного, — так пустых стульев в итоге меньше.

   • Рассаженное руками не трогаем. Сватов к родителям организатор посадил сам;
     авто-раскладка досаживает остальных, а не перетасовывает зал заново.

   • Один и тот же список даёт одну и ту же раскладку: никакого Math.random,
     сортировка с полным порядком (размер → сторона → id). Иначе второе нажатие
     выдавало бы другую картинку, и кнопке перестали бы верить.

   planSeating ничего не пишет — ни в S, ни в сеть. Именно поэтому её можно
   прогнать на синтетике: toySeatTest() ниже в этом же блоке.                  */

// Сколько мест держит семья. Пока семья не отказалась, зал считает её по числу
// приглашённых — та же формула, по которой тойхона выставляет счёт.
/* Само вычисление переехало в zal.js — его зовёт и образец. Здесь остались
   имена, под которыми к нему обращается остальной кабинет: переименовывать
   тридцать мест вызова значило бы менять работающий код ради косметики. */
function famSeats(f){ return toyFamSeats(f); }
const famSide = toyFamSide;
function planSeating(fams, tables){ return toyPlanSeating(fams, tables); }

/* Синтетика. Ни node, ни python в системе нет, поэтому проверка живёт здесь и
   гоняется из консоли браузера: toySeatTest(60) и toySeatTest(300). Проверяются
   ровно те свойства, ради которых алгоритм и писался, — семья не разорвана,
   стол не переполнен, сумма сходится, повтор даёт то же самое. Дешевле держать
   тридцать строк в кабинете, чем каждый раз собирать фейковый той руками. */
function toySeatTest(n, cap, nt, preseat){
  n = n|0 || 60; cap = cap|0 || 10;
  nt = nt|0 || Math.ceil(n*4.5/cap);
  preseat = preseat===undefined ? Math.min(5,n) : (preseat|0);
  let seed = (n*7919 + cap*31 + nt) & 0x7fffffff;    // свой ГПСЧ: тест обязан повторяться
  const rnd = ()=> ((seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const tables = Array.from({length:nt}, (_,i)=>({ id:i+1, num:i+1, capacity:cap }));
  const fams = Array.from({length:n}, (_,i)=>{
    const size = 1 + Math.floor(rnd()*8), r = rnd();
    const st = r<0.6 ? "yes" : (r<0.75 ? "no" : "pending");
    return { id:i+1, name:"F"+(i+1), side: rnd()<0.5 ? "kelin" : "kuyov",
      invited_count:size, rsvp_status:st,
      rsvp_count: st==="yes" ? Math.max(1, size - (rnd()<0.3?1:0)) : 0, table_id:null };
  });
  for(let i=0;i<preseat && i<n;i++) fams[i].table_id = tables[i % nt].id;

  const snapshot = fams.map(f=>f.table_id);
  const r1 = planSeating(fams, tables), r2 = planSeating(fams, tables);
  const errs = [];
  if(JSON.stringify(r1.plan)!==JSON.stringify(r2.plan)) errs.push("раскладка не воспроизводится");
  if(fams.some((f,i)=>f.table_id!==snapshot[i])) errs.push("planSeating меняет входные данные");

  const seen = new Set();
  for(const p of r1.plan){
    if(seen.has(p.family_id)) errs.push("семья посажена дважды: "+p.family_id);
    seen.add(p.family_id);
    const f = fams.find(x=>x.id===p.family_id);
    if(f.table_id!=null) errs.push("тронули рассаженного вручную: "+f.id);
    if(p.seats!==famSeats(f)) errs.push("семья разорвана: "+f.id);
  }

  // Считаем «было» и «досадили» раздельно. Кабинет позволяет посадить руками
  // семью из восьми за стол на шесть — такой стол переполнен ещё до кнопки, и
  // чинить его не наше дело. А вот усугубить нельзя: если авто-раскладка кого-то
  // за этот стол досадила, это уже её ошибка. Первый прогон синтетики без такого
  // разделения показал пять «переполненных» столов, которых алгоритм не касался.
  const was={}, add={};
  tables.forEach(tb=>{ was[tb.id]=0; add[tb.id]=0; });
  fams.forEach(f=>{ if(f.table_id!=null) was[f.table_id]+=famSeats(f); });
  r1.plan.forEach(p=>{ add[p.table_id]+=p.seats; });
  tables.forEach(tb=>{
    if(add[tb.id]>0 && was[tb.id]+add[tb.id]>tb.capacity)
      errs.push("переполнен стол "+tb.num+": "+(was[tb.id]+add[tb.id])+" из "+tb.capacity);
  });

  const need = fams.filter(f=>f.table_id==null && f.rsvp_status!=="no" && famSeats(f)>0);
  if(r1.plan.length + r1.left.length !== need.length) errs.push("рассаженные плюс непоместившиеся не сходятся со списком");
  if(r1.seats + r1.leftSeats !== need.reduce((acc,f)=>acc+famSeats(f),0)) errs.push("сумма мест не сходится");

  // Смешанные столы не ошибка, но если их половина зала — значит разделение
  // сторон перестало работать, и это видно только по такому счётчику.
  const sides = {}; tables.forEach(tb=>{ sides[tb.id]=new Set(); });
  fams.forEach(f=>{ if(f.table_id!=null) sides[f.table_id].add(famSide(f)); });
  r1.plan.forEach(p=>{ sides[p.table_id].add(famSide(fams.find(x=>x.id===p.family_id))); });
  const mixed = tables.filter(tb=>sides[tb.id].size>1).length;

  return { n, tables:nt, cap, preseat, placed:r1.plan.length, seats:r1.seats,
    left:r1.left.length, leftSeats:r1.leftSeats, tablesUsed:r1.tables, mixed,
    ok: errs.length===0, errs };
}

/* Запись рассадки. Пакетной записи table_id в API нет — есть только family_update
   на одну семью, — поэтому идём по списку, но по шесть запросов сразу: триста
   семей подряд по одной это минута с мёртвым экраном и обрыв на первом же
   провале связи. Прогресс показываем прямо на кнопке: иначе человек жмёт второй раз. */
async function pushTables(pairs, onStep){
  let i=0, done=0; const failed=[];
  const worker = async ()=>{
    while(i<pairs.length){
      const p = pairs[i++];
      let r=null;
      try { r = await call("family_update",{event_id:S.ev.id,family_id:p.family_id,table_id:p.table_id}); } catch(e){}
      if(!r || !r.family) failed.push(p);
      done++; if(onStep) onStep(done, pairs.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(6,pairs.length)}, worker));
  return failed;
}

async function autoSeat(btn){
  const t=L();
  if(!S.tables.length) return say(t.saNoTables);
  const res = planSeating(S.fams, S.tables);
  // Если не поместился вообще никто — это не «ничего не произошло», а нехватка
  // столов, и сказать об этом надо цифрами.
  if(!res.plan.length) return say(res.left.length ? t.saLeft(res.left.length,res.leftSeats)+" "+t.saLeftHint : t.saNothing);
  haptic("medium");
  btn.disabled=true; btn.textContent=t.saSaving(0,res.plan.length);
  const failed = await pushTables(res.plan, (d,total)=>{ btn.textContent=t.saSaving(d,total); });
  // На экране должно стоять только то, что принял сервер: иначе после
  // перезагрузки часть гостей молча вернётся в «не рассажены».
  const bad = new Set(failed.map(p=>p.family_id));
  const ok = res.plan.filter(p=>!bad.has(p.family_id));
  ok.forEach(p=>{ const f=S.fams.find(x=>x.id===p.family_id); if(f) f.table_id=p.table_id; });
  if(!ok.length){ btn.disabled=false; btn.textContent=t.saBtn; return say(t.errNet); }
  S.autoseat = { ids: ok.map(p=>p.family_id), leftFams: res.left.length, leftSeats: res.leftSeats };
  haptic("medium"); render();
  if(failed.length) say(t.saPartial(failed.length));
}

// Право передумать. Возвращаем в «не рассажены» ровно тех, кого посадила кнопка,
// — руками посаженных и прошлые раскладки не трогаем.
async function autoSeatUndo(btn){
  const t=L(), a=S.autoseat; if(!a) return;
  const ids = a.ids.filter(id=>S.fams.some(f=>f.id===id && f.table_id!=null));
  if(!ids.length){ S.autoseat=null; return render(); }
  if(!await ask(t.saUndoConfirm(ids.length))) return;
  haptic("medium");
  btn.disabled=true; btn.textContent=t.saUndoing(0,ids.length);
  const failed = await pushTables(ids.map(id=>({family_id:id,table_id:null})), (d,total)=>{ btn.textContent=t.saUndoing(d,total); });
  const bad = new Set(failed.map(p=>p.family_id));
  ids.forEach(id=>{ if(bad.has(id)) return; const f=S.fams.find(x=>x.id===id); if(f) f.table_id=null; });
  // Не отменённые остаются в списке кнопки: второе нажатие доотменит их.
  S.autoseat = failed.length ? { ids: failed.map(p=>p.family_id), leftFams:a.leftFams, leftSeats:a.leftSeats } : null;
  render();
  say(failed.length ? t.saPartial(failed.length) : t.saUndone);
}

/* В Telegram WebView на телефоне программное скачивание молча не срабатывает:
   клик по <a download> ничего не делает и ничего не сообщает. Человек жмёт
   «Выгрузить», не получает файла и решает, что выгрузка сломана — а на дорогом
   тарифе это прямой повод просить деньги назад.

   Поэтому на телефоне сразу открываем текст: его копируют и вставляют в Excel
   или Google Таблицы — это работает везде. На десктопе остаётся обычный файл. */
function isMobileTg(){
  const p = tg?.platform || "";
  return p === "android" || p === "ios";
}
function dl(name,content,type){
  if(isMobileTg()) return showCopySheet(name, content);
  try{
    const b=new Blob([content],{type});const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
  }catch(e){ showCopySheet(name, content); }
}

/* ── A-22. Документ по столам на телефоне ────────────────────────────────────
   Половина платного оффера — «рассадка без бумажек», и на телефоне она
   открывалась вываленным HTML-исходником: `<html><head><style>body{font-family…`
   во весь экран. Так получалось честно и по шагам: скачать файл во встроенном
   браузере Telegram нельзя (D-24), поэтому документ шёл в `printDoc`, тот звал
   `window.open`, а Telegram на iOS отдаёт `null` — и оставался единственный
   запасной путь, textarea с исходником.

   Чинить надо не запасной путь, а сам замысел: на телефоне не существует ни
   файла, ни печати, поэтому и отдавать надо не файл, а документ. Показываем
   его свёрстанным во весь экран — таким, каким он выйдет на бумаге. Дальше
   человек делает то, что и так делает: скриншот и пересылка администратору
   тойхоны, ровно как со счётом зала через zalPng.

   Почему не картинка через canvas, как zalPng: там одно число во весь лист,
   здесь — тридцать столов по десять семей. В PNG такой список либо нечитаем,
   либо весит столько, что Telegram сожмёт его в кашу. Тот же список текстом
   («Скопировать») вставляется в Excel и Google Таблицы и остаётся редактируемым.
   На десктопе всё как было: настоящий .doc и настоящая печать. */
function showDocOverlay(bodyHtml, plain){
  const t = L();
  const ov = document.createElement("div"); ov.className = "docov";
  ov.innerHTML = `<div class="dwrap">
    <div class="dpaper">${bodyHtml}</div>
    <div class="dbar">
      <button class="b" id="dcopy">${t.dlCopy}</button>
      <button class="b sec" id="dclose">${t.zPngClose}</button>
    </div>
    <div class="dhint">${t.docHint}</div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#dclose").onclick = () => ov.remove();
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  ov.querySelector("#dcopy").onclick = async () => {
    try{ await navigator.clipboard.writeText(plain); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = plain; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(e2){}
      ta.remove();
    }
    haptic("medium");
    ov.querySelector("#dcopy").textContent = t.dlCopied;
  };
}
function showCopySheet(name, content){
  const t=L();
  const ov=document.createElement("div"); ov.className="sheet-ov";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <h2>${esc(t.dlTitle)}</h2>
    <div class="sub">${esc(t.dlSub)}</div>
    <textarea id="dlt" readonly style="height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px"></textarea>
    <button class="ok" id="dlcopy" style="margin-top:12px">${esc(t.dlCopy)}</button>
    <button class="more" id="dlclose" type="button" style="background:none;border:0;width:100%;cursor:pointer">${esc(t.cntCancel)}</button>
  </div>`;
  document.body.appendChild(ov);
  // Через .value, а не в разметку: содержимое — данные людей, и </textarea> внутри
  // имени семьи закрыл бы поле, а остальное ушло бы в документ как разметка.
  ov.querySelector("#dlt").value = content.replace(/^﻿/, "");
  ov.querySelector("#dlcopy").onclick=async()=>{
    const box=ov.querySelector("#dlt");
    box.select(); box.setSelectionRange(0, 999999);
    try{ await navigator.clipboard.writeText(box.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
    haptic("medium");
    ov.querySelector("#dlcopy").textContent = L().dlCopied;
  };
  ov.querySelector("#dlclose").onclick=()=>ov.remove();
  ov.onclick=(e)=>{ if(e.target===ov) ov.remove(); };
}

/* ---------- шаг 54: счёт для зала картинкой ----------
   Администратору тойхоны нужно переслать число в WhatsApp. CSV и .doc туда не
   пересылают — пересылают картинку. Рисуем на canvas и показываем оверлеем:
   в Telegram WebView программное скачивание срабатывает не всегда, а долгое
   нажатие на картинку работает везде. Кнопка «скачать» остаётся для десктопа. */
// Обе — из zal.js: печатное приглашение ниже пользуется ими же.
function wrapText(ctx, text, maxW){ return toyWrapText(ctx, text, maxW); }
function fitFont(ctx, text, maxW, family, start, min){ return toyFitFont(ctx, text, maxW, family, start, min); }
/* Рисование переехало в zal.js: ровно эту картинку показывает образец
   на выдуманном тое, до денег. Здесь осталось только собрать числа
   из состояния кабинета и показать готовое. */
async function zalPng(){
  const t=L(), c=counts();
  const sum=s=>S.fams.filter(f=>f.side===s&&f.rsvp_status==="yes").reduce((a,f)=>a+(f.rsvp_count||0),0);
  const est=c.yes+Math.round(c.pendInv*0.6);
  try { await document.fonts.ready; } catch(e) {}

  const cv = toyZalPng({
    couple: S.ev.couple,
    // Дата словами через toyDateLong, а не через Intl: на uz-UZ Intl рисует
    // «2026 M10 18» прямо в счёте, который несут администратору зала.
    dateStr: toyDateLong(S.ev.event_date, lang),
    time: S.ev.event_time,
    venue: S.ev.venue_name,
    est, yes:c.yes, pendInv:c.pendInv, no:c.no,
    kuyov: sum("kuyov"), kelin: sum("kelin"),
    answered: S.fams.filter(f=>f.rsvp_status!=="pending").length,
    total: S.fams.length,
    tables: S.tables.length, cap: S.tables[0]?.capacity,
    today: toyDateLong(new Date().toISOString().slice(0,10), lang),
    t,
  });

  showPngOverlay(cv, `${t.zPngFile}${(S.ev.couple||"toy").replace(/\s+/g,"_")}.png`, t.zPngHint);
}

/* Показ готовой картинки. В Telegram WebView программное скачивание срабатывает
   не всегда, а долгое нажатие на картинку работает везде — поэтому картинку
   сначала показываем, и только потом предлагаем сохранить. */
function showPngOverlay(cv, file, hint){
  const t = L();
  const url = cv.toDataURL("image/png");
  const ov = document.createElement("div");
  ov.className = "pngov";
  ov.innerHTML = `<div class="inner">
    <img src="${url}" alt="">
    <div class="hint">${hint}</div>
    <button class="b" id="pngSave">${t.zPngSave}</button>
    <button class="b sec" id="pngClose">${t.zPngClose}</button>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector("#pngClose").onclick = () => ov.remove();
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  ov.querySelector("#pngSave").onclick = () => {
    const a = document.createElement("a"); a.href = url; a.download = file; a.click();
  };
}



/* ── Печатное приглашение ────────────────────────────────────────────────────
   Пожилая родня без телеграма из продукта просто выпадала: ссылку ей отправить
   некуда. Одна картинка решает оба случая — её пересылают в WhatsApp и её же
   печатают на принтере или в фотосалоне.

   Рисуем палитрой и рамкой ТОЙ ЖЕ темы, что и веб-приглашение. Иначе бумажное
   и цифровое читались бы как два разных тоя. */
function themeVars(){
  const t = toyTheme(S.ev.theme || "zar");
  const v = t.vars;
  return { t,
    bg: v["--bg"], card: v["--card"], ink: v["--ink"], muted: v["--muted"],
    accent: v["--accent"], accentInk: v["--accent-ink"] || v["--accent"], deep: v["--deep"],
    line: v["--line"], frame: t.frame };
}
function printFrame(x, W, H, c){
  x.strokeStyle = c.accent;
  if(c.frame === "double"){
    x.lineWidth = 3; x.strokeRect(46, 46, W-92, H-92);
    x.lineWidth = 1; x.strokeRect(62, 62, W-124, H-124);
  } else if(c.frame === "corner"){
    x.lineWidth = 3; const L = 130, m = 52;
    x.beginPath();
    x.moveTo(m, m+L); x.lineTo(m, m); x.lineTo(m+L, m);
    x.moveTo(W-m-L, H-m); x.lineTo(W-m, H-m); x.lineTo(W-m, H-m-L);
    x.stroke();
  } else if(c.frame === "arch"){
    // Стрельчатая арка: два верхних угла скруглены сильно, нижние почти прямые.
    const m = 50, r = Math.min((W-2*m)/2, 320);
    x.lineWidth = 3; x.beginPath();
    x.moveTo(m, H-m); x.lineTo(m, m+r);
    x.quadraticCurveTo(m, m, m+r, m);
    x.lineTo(W-m-r, m);
    x.quadraticCurveTo(W-m, m, W-m, m+r);
    x.lineTo(W-m, H-m); x.closePath(); x.stroke();
  } else if(c.frame === "band"){
    x.lineWidth = 2;
    [64, H-64].forEach(y => {
      x.beginPath(); x.moveTo(50, y); x.lineTo(W-50, y); x.stroke();
      // Розетки палака вдоль полосы — тот же мотив, что в теме suzani.
      for(let px = 96; px < W-80; px += 78){
        x.beginPath(); x.arc(px, y, 9, 0, 6.284); x.stroke();
        x.beginPath(); x.arc(px, y, 3.2, 0, 6.284); x.fill();
      }
    });
  }
}
async function invitePng(fam){
  const t = L(), c = themeVars();
  // Приглашение печатают либо конкретной семье (тогда QR ведёт на её ответ),
  // либо образцом — чтобы посмотреть, как получится.
  const link = fam ? S.inviteLink.replace("{token}", fam.token) : "";
  // Язык картинки — язык ПРИГЛАШЕНИЯ, а не кабинета: её увидит гость.
  const il = S.ev.lang || "uz_latin";
  const U = { uz_latin:{pre:"TAKLIFNOMA", when:"QACHON", where:"QAYERDA", ans:"Javobingizni shu havola orqali bildiring"},
              uz_cyrillic:{pre:"ТАКЛИФНОМА", when:"ҚАЧОН", where:"ҚАЕРДА", ans:"Жавобингизни шу ҳавола орқали билдиринг"},
              ru:{pre:"ПРИГЛАШЕНИЕ", when:"КОГДА", where:"ГДЕ", ans:"Ответить можно по этой ссылке"} }[il];
  // Кавычки внутри имени НЕ трогаем: значение вида "Cormorant Garamond",Georgia,serif
  // и так валидное сокращение font. Раньше я срезал крайние кавычки — оставалась
  // непарная в середине, canvas молча отбрасывал всё назначение шрифта, и половина
  // оформлений печаталась именами в 10 пикселей.
  const DISP = c.t.vars["--display"];
  const SANS = "Manrope, system-ui, sans-serif";
  // Шрифт темы на этой странице нигде не применён, значит браузер его и не грузил.
  // document.fonts.ready сам по себе не поможет: он ждёт начатые загрузки, а не
  // те, которых никто не просил. Просим явно — иначе canvas рисует подстановкой.
  try {
    await Promise.all([document.fonts.load(`600 92px ${DISP}`), document.fonts.load(`400 25px ${DISP}`)]);
    await document.fonts.ready;
  } catch(e) {}

  // A5 при 150 dpi: столько же пикселей, сколько нужно для печати, и не больше —
  // 300 dpi даёт 8 мегапикселей, которые Telegram всё равно пережмёт.
  const W = 874, H = 1240;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  x.fillStyle = c.bg; x.fillRect(0, 0, W, H);
  printFrame(x, W, H, c);

  x.textAlign = "center";
  x.fillStyle = c.accentInk; x.font = `600 20px ${SANS}`;
  x.save(); x.letterSpacing = "7px"; x.fillText(U.pre, W/2, 178); x.restore();

  // Имена — единственное, ради чего приглашение берут в руки.
  const names = (S.ev.couple || "").split(/&|\bи\b|\bva\b/).map(s => s.trim()).filter(Boolean);
  x.fillStyle = c.ink;
  let y = 300;
  names.forEach((n, i) => {
    if(i){
      x.fillStyle = c.accentInk; x.font = `italic 42px ${DISP}`;
      x.fillText("&", W/2, y - 6); y += 62;
      x.fillStyle = c.ink;
    }
    fitFont(x, n, W - 200, DISP, 92, 40);
    x.fillText(n, W/2, y); y += 96;
  });

  // Обращение
  y += 14;
  x.fillStyle = c.ink; x.font = `400 25px ${DISP}`;
  wrapText(x, S.ev.greeting || "", W - 230).slice(0, 6).forEach(l => { x.fillText(l, W/2, y); y += 38; });

  // Детали — теми же подписями, что на веб-приглашении
  const dstr = S.ev.event_date
    ? new Date(S.ev.event_date).toLocaleDateString(il === "ru" ? "ru-RU" : "uz-UZ",
        { day:"numeric", month:"long", year:"numeric" }) : "";
  y = Math.max(y + 46, H - 430);
  const line = (label, val, sub) => {
    if(!val) return;
    x.fillStyle = c.muted; x.font = `600 14px ${SANS}`;
    x.save(); x.letterSpacing = "3px"; x.fillText(label, W/2, y); x.restore(); y += 34;
    // Цифры всегда сансом: у Cormorant и Prata старостильные знаки, и «21»
    // на бумаге читается как «2I» — ровно там, где ошибиться нельзя.
    x.fillStyle = c.ink; x.font = `500 27px ${/\d/.test(val) ? SANS : DISP}`;
    x.fillText(val, W/2, y); y += sub ? 32 : 46;
    if(sub){ x.fillStyle = c.muted; x.font = `400 20px ${SANS}`; x.fillText(sub, W/2, y); y += 44; }
  };
  line(U.when, [dstr, S.ev.event_time].filter(Boolean).join(" · "));
  line(U.where, S.ev.venue_name || "", S.ev.venue_addr || "");

  // QR обязателен: печатное приглашение существует ради родни без телеграма,
  // а ссылку .../invite.html?t=k3n8x… руками не набирают. Без кода такой гость
  // ответить не может — и счёт для тойханы снова неполный.
  //
  // Токен подставляем позже, для каждой семьи свой; здесь рисуем по шаблону,
  // чтобы кегль и отступы считались один раз.
  const qrBox = 150, qrY = H - 232;
  if (window.qrDraw && link) {
    try {
      // Светлая подложка под кодом всегда белая, даже на тёмном оформлении:
      // инверсный QR читают не все камеры, а рисковать тут нечем.
      qrDraw(x, link, W/2 - qrBox/2, qrY, qrBox, "#000000", "#FFFFFF", 3);
    } catch(e) { /* ссылка длиннее версии 10 — тогда просто без кода */ }
  }
  x.fillStyle = c.muted; x.font = `400 17px ${SANS}`;
  x.fillText(U.ans, W/2, H - 58);

  showPngOverlay(cv, `taklifnoma-${(S.ev.couple||"toy").replace(/\s+/g,"_")}.png`, t.pInvHint);
}
