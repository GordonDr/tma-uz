<!doctype html><meta charset="utf-8"><title>Проверка QR</title>
<body style="background:#fff;margin:0;padding:16px;font:13px system-ui">
<!-- Свой генератор QR нельзя принимать на глаз: код может выглядеть правильным
     и не читаться камерой. Настоящего декодера в этом браузере нет
     (BarcodeDetector на Windows не реализован), поэтому проверяем инвариантами
     и обратным разбором собственной матрицы.

     Что именно проверяется — это ровно те места, где такой генератор ломается:
       1. Рид—Соломон: кодовое слово обязано делиться на порождающий многочлен.
          Проверка не зависит от моей же реализации деления — свойство внешнее.
       2. Поисковые узоры: три угла, кольцо 7×7 с отступом.
       3. Синхрополосы: строгое чередование.
       4. Строка формата: обе копии совпадают и разбираются обратно в (M, маска 0).
       5. Данные: снимаем маску, идём тем же зигзагом наоборот, раз-чередуем блоки
          и сверяем байты с исходной строкой. Это ловит ошибки раскладки,
          чередования и маски — самые частые и самые незаметные. -->
<pre id="log" style="font:12px ui-monospace,monospace;white-space:pre-wrap;line-height:1.5"></pre>
<div id="out" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"></div>
<script src="qr.js"></script>
<script>
const CASES = [
  "https://gordondr.github.io/tma-uz/toy/invite.html?t=k3n8xq7",
  "https://gordondr.github.io/tma-uz/toy/invite.html?t=a1b2c3d4e5f6g7h8",
  "https://example.com/",
  "Aziz & Nilufar",
  "Ҳурматли меҳмон, тўйга таклиф этамиз",
  "https://gordondr.github.io/tma-uz/toy/invite.html?t=" + "z".repeat(60),
];
const log = [];
let fails = 0;
const check = (cond, msg) => { if(!cond){ fails++; log.push("  ПРОВАЛ: " + msg); } };

/* Рид—Соломон: остаток от деления полного кодового слова на порождающий = 0. */
function checkRS(){
  for (const n of [10, 16, 18, 22, 26]) {
    const data = Array.from({length: 20}, (_, i) => (i * 37 + 11) & 255);
    const ec = qrEC(data, n);
    const rem = qrEC(data.concat(ec), n);
    check(rem.every(v => v === 0), `RS(${n}): остаток не ноль → ${rem.join(",")}`);
  }
  log.push("1. Рид—Соломон: кодовое слово делится нацело — " + (fails ? "нет" : "да"));
}

function checkStructure(m, ver){
  const size = m.length;
  check(size === 17 + ver * 4, `размер ${size} не соответствует версии ${ver}`);
  // Поисковые узоры
  const finderOk = (r0, c0) => {
    for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      const ring = (r === 0 || r === 6 || c === 0 || c === 6);
      const core = (r >= 2 && r <= 4 && c >= 2 && c <= 4);
      if (m[r0+r][c0+c] !== (ring || core ? 1 : 0)) return false;
    }
    return true;
  };
  check(finderOk(0,0), "поисковый узор слева сверху");
  check(finderOk(0,size-7), "поисковый узор справа сверху");
  check(finderOk(size-7,0), "поисковый узор слева снизу");
  // Синхрополосы
  for (let i = 8; i < size - 8; i++) {
    check(m[6][i] === (i % 2 === 0 ? 1 : 0), `горизонтальная синхрополоса в ${i}`);
    check(m[i][6] === (i % 2 === 0 ? 1 : 0), `вертикальная синхрополоса в ${i}`);
  }
  check(m[size-8][8] === 1, "тёмный модуль");
}

/* Обе копии строки формата должны совпадать и разбираться в (M, маска 0). */
function checkFormat(m){
  const size = m.length;
  let a = 0, b = 0;
  for (let i = 14; i >= 0; i--) {
    let bit;
    if (i < 6) bit = m[8][i];
    else if (i === 6) bit = m[8][7];
    else if (i === 7) bit = m[8][8];
    else if (i === 8) bit = m[7][8];
    else bit = m[14 - i][8];
    a = (a << 1) | bit;
    b = (b << 1) | (i < 7 ? m[size-1-i][8] : m[8][size-15+i]);
  }
  check(a === b, `копии строки формата разошлись: ${a.toString(2)} и ${b.toString(2)}`);
  check(a === 0x5412, `строка формата ${a.toString(16)} вместо 5412 (уровень M, маска 0)`);
}

/* Снимаем маску, читаем зигзагом наоборот, раз-чередуем и сверяем байты. */
function decodeBack(m, ver){
  const size = m.length;
  const [totalData, ecPerBlock, g1, g1len, g2, g2len] = QR_VER[ver];
  const al = QR_ALIGN[ver];
  const isFunc = (r, c) =>
    (r <= 8 && c <= 8) || (r <= 8 && c >= size - 8) || (r >= size - 8 && c <= 8) ||
    r === 6 || c === 6 ||
    (ver >= 7 && ((r < 6 && c >= size - 11) || (c < 6 && r >= size - 11))) ||
    al.some(ar => al.some(ac => {
      if ((ar <= 8 && ac <= 8) || (ar <= 8 && ac >= size - 9) || (ar >= size - 9 && ac <= 8)) return false;
      return Math.abs(r - ar) <= 2 && Math.abs(c - ac) <= 2;
    }));

  const bits = [];
  let up = true;
  for (let col = size - 1; col > 0; col -= 2) {
    if (col === 6) col--;
    for (let k = 0; k < size; k++) {
      const row = up ? size - 1 - k : k;
      for (const c of [col, col - 1]) {
        if (isFunc(row, c)) continue;
        bits.push(m[row][c] ^ ((row + c) % 2 === 0 ? 1 : 0));
      }
    }
    up = !up;
  }
  const stream = [];
  for (let i = 0; i + 7 < bits.length; i += 8) stream.push(bits.slice(i, i+8).reduce((a,b)=>(a<<1)|b, 0));

  // Раз-чередование: обратное тому, как складывали
  const lens = [];
  for (let i = 0; i < g1; i++) lens.push(g1len);
  for (let i = 0; i < g2; i++) lens.push(g2len);
  const blocks = lens.map(() => []);
  let at = 0;
  const maxLen = Math.max(...lens);
  for (let i = 0; i < maxLen; i++) for (let b = 0; b < lens.length; b++) {
    if (i < lens[b]) blocks[b].push(stream[at++]);
  }
  const data = [].concat(...blocks);

  // Разбор заголовка
  const dbits = [];
  for (const byte of data) for (let i = 7; i >= 0; i--) dbits.push((byte >> i) & 1);
  const take = (at, n) => dbits.slice(at, at + n).reduce((a,b)=>(a<<1)|b, 0);
  const mode = take(0, 4);
  const lenBits = ver >= 10 ? 16 : 8;
  const len = take(4, lenBits);
  const bytes = [];
  for (let i = 0; i < len; i++) bytes.push(take(4 + lenBits + i * 8, 8));
  return { mode, len, text: new TextDecoder().decode(new Uint8Array(bytes)) };
}

checkRS();
log.push("");
for (const text of CASES) {
  const before = fails;
  const m = qrMatrix(text);
  const ver = (m.length - 17) / 4;
  checkStructure(m, ver);
  checkFormat(m);
  const got = decodeBack(m, ver);
  check(got.mode === 4, `режим ${got.mode} вместо 4 (байтовый)`);
  check(got.text === text, `обратный разбор дал [${got.text}]`);
  log.push((fails === before ? "OK  " : "СБОЙ ") + `v${ver} ${m.length}×${m.length} · ` + text.slice(0, 44));

  const cv = document.createElement("canvas"); cv.width = cv.height = 360;
  qrDraw(cv.getContext("2d"), text, 0, 0, 360, "#000", "#fff", 4);
  cv.style.cssText = "width:132px;height:132px;image-rendering:pixelated;border:1px solid #ccc";
  document.getElementById("out").appendChild(cv);
}
log.push("");
log.push(fails ? `ИТОГ: провалов ${fails}` : "ИТОГ: все проверки пройдены");
document.getElementById("log").textContent = log.join("\n");
window.__QR_RESULT = { fails, log };
</script>
</body>
